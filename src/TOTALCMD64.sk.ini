msgTcListHelp=Zoznam súborov\nŠípky: názov položky a pri označených položkách aj "selected".\n"..": aj priečinok, do ktorého vedie.\nMedzerník: označí položku alebo zruší označenie.\nF2, Control+R: znovu načítajú panel, so zvukom.\nControl+F8: strom priečinkov; šípky povedia priečinok, či je otvorený alebo zatvorený, a jeho úroveň.\nŠípka doprava v strome: otvorí priečinok.\nŠípka doľava v strome: zatvorí priečinok.\n%1: celý riadok.\n%2: zoznam klávesov skriptov.
msgTcAppHelp=Skripty JAWS pre Total Commander, verzia %1. Skripty skracujú to, čo sa číta v zozname súborov a v strome priečinkov, sprístupňujú dialógy Total Commandera, Lister, porovnanie podľa obsahu a synchronizáciu priečinkov a pridávajú klávesy pre stĺpce, cestu a stavové riadky. Zoznam klávesov zobrazíte stlačením %2.
