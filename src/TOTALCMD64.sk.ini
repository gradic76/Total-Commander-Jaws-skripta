msgTcSyncHelp=Synchronizácia priečinkov\nŠípky vo výsledkoch: názov súboru a vzťah: rovnaké, rozdielne, zľava doprava, sprava doľava, iba vľavo, iba vpravo, ešte neporovnané alebo preskočiť.\n%1: celý riadok s veľkosťami a dátumami.\nMedzerník: mení smer kopírovania riadka alebo ho vypína (preskočiť). Oznámenie Total Commandera o zmenenom riadku číta JAWS tak, ako je.\nControl+Shift+L: zobraziť zľava doprava.\nControl+Shift+E: zobraziť rovnaké.\nControl+Shift+N: zobraziť rozdielne.\nControl+Shift+R: zobraziť sprava doľava.\nControl+Shift+D: zobraziť duplicitné.\nControl+Shift+S: zobraziť jednotlivé.\nPo každom z týchto klávesov: stavový riadok Total Commandera s počtom zobrazených a skrytých.\nTlačidlo Synchronizovať: dialóg so smermi kopírovania a ich cieľovými priečinkami.
msgTcCompareHelp=Porovnanie podľa obsahu\nOtvorenie okna, Porovnať: ľavý súbor, pravý súbor a stavový riadok Total Commandera.\nÚpravy: stlačte najprv; panely potom dostanú textový kurzor.\nĎalší rozdiel, Predchádzajúci rozdiel: pri úpravách riadok z oboch súborov, najprv ľavý; "blank" pre stranu bez tohto riadka.\nŠípky: čítajú riadky.\nMimo úprav: iba stavový riadok, pretože tam nemožno zistiť, ktorý rozdiel je aktuálny.\nDlhé riadky: čítajú sa, nakoľko ich panel zobrazuje.\n%1: ktorý súbor je ľavý a ktorý pravý, a stavový riadok.
