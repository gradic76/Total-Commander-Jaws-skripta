msgTcListerHelp=Lister\nOtvorenie Listera: názov súboru.\nN, Alt+šípka doprava: ďalší súbor, s názvom.\nP, Alt+šípka doľava: predchádzajúci súbor, s názvom.\n1 až 8: režim zobrazenia.\nF7, Control+F: hľadanie; potom celý riadok s nájdeným.\nF3, F5, Shift+F7: ďalší výskyt, s riadkom.\nShift+F3, Shift+F5: predchádzajúci výskyt, s riadkom.\nF2: znovu načíta súbor, so zvukom.\nF6: textový kurzor zapnutý alebo vypnutý. Šípky čítajú text iba vtedy, keď je zapnutý, a Total Commander si to pamätá.\nF11: maximalizované okno zapnuté alebo vypnuté.\nAlt+Enter: celá obrazovka zapnutá alebo vypnutá.\nPlus, mínus: väčšie alebo menšie písmo, so zvukom a novou veľkosťou.\nControl+0: uložená veľkosť písma.\n%2: pozícia v súbore v percentách.\nZvuk a video: posúvače počas prehrávania mlčia a hovoria, keď nimi pohnete.\nTab: prechádza medzi posúvačom pozície a hlasitosti.\nShift alebo Control so šípkami na posúvači: idú do Listera, nie do JAWS.\n%1: zoznam klávesov skriptov.
