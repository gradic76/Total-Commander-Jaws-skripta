msgTcHotKeyHelp=Klávesové skratky skriptov pre Total Commander\n%1 až %2: stĺpce za názvom položky v fokuse, s nadpisom stĺpca z hlavičky, v poradí, v akom ich Total Commander zobrazuje. Sledujú každé zobrazenie aj vaše vlastné stĺpce. V zobrazení Podrobnosti: 1 veľkosť, 2 dátum a čas, 3 atribúty. Stlačené dvakrát rýchlo zobrazí všetky stĺpce položky vo virtuálnom prehliadači, jeden na riadok, s kurzorom na požadovanom stĺpci.\n%3: cesta aktívneho panela; stlačené dvakrát rýchlo ju skopíruje do schránky.\n%8: ktorý panel je aktívny.\n%4: celý riadok položky, s pozíciou.\n%5: stavový riadok aktívneho panela; v okne priebehu súhrn priebehu; v Listeri pozícia v súbore v percentách.\n%9: stavový riadok a voľné miesto druhého panela, napr. na kontrolu cieľa pred kopírovaním.\n%6: v dialógoch Total Commandera číta celý dialóg; v okne porovnania podľa obsahu oba súbory a stavový riadok.\n%7: verzia skriptov.
