msgTcListHelp=Lista plików\nStrzałki: nazwa elementu, a przy zaznaczonych także "selected".\n"..": także folder, do którego prowadzi.\nSpacja: zaznacza element lub usuwa zaznaczenie.\nF2, Control+R: ponownie wczytują panel, z dźwiękiem.\nControl+F8: drzewo folderów; strzałki mówią folder, czy jest otwarty czy zamknięty, i jego poziom.\nStrzałka w prawo w drzewie: otwiera folder.\nStrzałka w lewo w drzewie: zamyka folder.\n%1: cały wiersz.\n%2: lista klawiszy skryptów.
msgTcAppHelp=Skrypty JAWS dla Total Commandera, wersja %1. Skrypty skracają to, co jest czytane na liście plików i w drzewie folderów, czynią użytecznymi okna dialogowe Total Commandera, Listera, porównanie według zawartości i synchronizację folderów, oraz dodają klawisze dla kolumn, ścieżki i wierszy stanu. Aby zobaczyć listę klawiszy, naciśnij %2.
