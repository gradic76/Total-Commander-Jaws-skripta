msgTcSyncHelp=Synchronizacja folderów\nStrzałki w wynikach: nazwa pliku i relacja: równe, różne, z lewej na prawą, z prawej na lewą, tylko po lewej, tylko po prawej, jeszcze nie porównane lub pomiń.\n%1: cały wiersz z rozmiarami i datami.\nSpacja: zmienia kierunek kopiowania wiersza lub go wyłącza (pomiń). Komunikat Total Commandera o zmienionym wierszu JAWS czyta tak, jak jest.\nControl+Shift+L: pokaż z lewej na prawą.\nControl+Shift+E: pokaż równe.\nControl+Shift+N: pokaż różne.\nControl+Shift+R: pokaż z prawej na lewą.\nControl+Shift+D: pokaż duplikaty.\nControl+Shift+S: pokaż pojedyncze.\nPo każdym z tych klawiszy: wiersz stanu Total Commandera z liczbą pokazanych i ukrytych.\nPrzycisk Synchronizuj: okno z kierunkami kopiowania i ich folderami docelowymi.
msgTcCompareHelp=Porównaj według zawartości\nOtwarcie okna, Porównaj: lewy plik, prawy plik i wiersz stanu Total Commandera.\nEdycja: naciśnij najpierw; panele otrzymują wtedy kursor tekstowy.\nNastępna różnica, Poprzednia różnica: w edycji wiersz z obu plików, najpierw lewy; "blank" dla strony bez tego wiersza.\nStrzałki: czytają wiersze.\nPoza edycją: tylko wiersz stanu, bo tam nie wiadomo, która różnica jest bieżąca.\nDługie wiersze: czytane są tak daleko, jak panel je pokazuje.\n%1: który plik jest lewy, a który prawy, oraz wiersz stanu.
