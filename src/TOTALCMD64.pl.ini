msgTcListerHelp=Lister\nOtwarcie Listera: nazwa pliku.\nN, Alt+Strzałka w prawo: następny plik, z nazwą.\nP, Alt+Strzałka w lewo: poprzedni plik, z nazwą.\n1 do 8: tryb wyświetlania.\nF7, Control+F: wyszukiwanie; potem cały wiersz ze znalezionym.\nF3, F5, Shift+F7: następne wystąpienie, z wierszem.\nShift+F3, Shift+F5: poprzednie wystąpienie, z wierszem.\nF2: ponownie wczytuje plik, z dźwiękiem.\nF6: kursor tekstowy włączony lub wyłączony. Strzałki czytają tekst tylko wtedy, gdy jest włączony, a Total Commander to zapamiętuje.\nF11: zmaksymalizowane okno włączone lub wyłączone.\nAlt+Enter: pełny ekran włączony lub wyłączony.\nPlus, minus: większa lub mniejsza czcionka, z dźwiękiem i nowym rozmiarem.\nControl+0: zapisany rozmiar czcionki.\n%2: pozycja w pliku w procentach.\nDźwięk i wideo: suwaki milczą podczas odtwarzania i mówią, gdy je przesuniesz.\nTab: przechodzi między suwakami pozycji i głośności.\nShift lub Control ze strzałkami na suwaku: trafiają do Listera, nie do JAWS.\n%1: lista klawiszy skryptów.
