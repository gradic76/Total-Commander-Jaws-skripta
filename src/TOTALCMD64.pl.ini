msgTcHotKeyHelp=Klawisze skryptów dla Total Commandera\n%1 do %2: kolumny po nazwie elementu z fokusem, z tytułem kolumny z nagłówka, w kolejności, w jakiej Total Commander je pokazuje. Działają w każdym widoku i z Twoimi własnymi kolumnami. W widoku Pełny: 1 rozmiar, 2 data i czas, 3 atrybuty. Naciśnięte dwa razy szybko pokazuje wszystkie kolumny elementu w wirtualnej przeglądarce, jedną na wiersz, z kursorem na żądanej kolumnie.\n%3: ścieżka aktywnego panelu; naciśnięte dwa razy szybko kopiuje ją do schowka.\n%8: który panel jest aktywny.\n%4: cały wiersz elementu, z pozycją.\n%5: wiersz stanu aktywnego panelu; w oknie postępu podsumowanie postępu; w Listerze pozycja w pliku w procentach.\n%9: wiersz stanu i wolne miejsce drugiego panelu, np. do sprawdzenia celu przed kopiowaniem.\n%6: w oknach dialogowych Total Commandera czyta całe okno; w oknie porównania według zawartości oba pliki i wiersz stanu.\n%7: wersja skryptów.
