; Total Commander JAWS scripts: messages in Chinese (Simplified)
; Translated from TOTALCMD64.hr.ini by Claude (machine translation, not reviewed). %1, %2... are filled in by the scripts; \n is a line break.
; Total Commander's command and view names are taken from Chinese TC (WCMD_CHN.MNU, WCMD_CHN.LNG), without the access keys.

