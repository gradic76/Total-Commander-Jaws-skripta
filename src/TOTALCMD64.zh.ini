msgTcListerHelp=Lister\n打开 Lister：文件名。\nN，Alt+右箭头：下一个文件，带名称。\nP，Alt+左箭头：上一个文件，带名称。\n1 到 8：显示模式。\nF7，Control+F：查找；然后是包含找到内容的整行。\nF3，F5，Shift+F7：下一个找到项，带该行。\nShift+F3，Shift+F5：上一个找到项，带该行。\nF2：重新载入文件，带声音。\nF6：文本光标开或关。方向键只在开启时朗读文本，Total Commander 会记住此设置。\nF11：最大化窗口开或关。\nAlt+Enter：全屏开或关。\n加号，减号：字体变大或变小，带声音和新大小。\nControl+0：已保存的字体大小。\n%2：文件中的位置（百分比）。\n音频和视频：滑块在播放时保持安静，移动时朗读。\nTab：在位置滑块和音量滑块之间切换。\n在滑块上 Shift 或 Control 加方向键：发送给 Lister，而不是 JAWS。\n%1：脚本按键列表。
