msgTcListHelp=文件列表\n方向键：项目名称，已标记的项目还有 "selected"。\n".."：还有它通向的文件夹。\n空格：标记项目或取消标记。\nF2，Control+R：重新读取面板，带声音。\nControl+F8：文件夹树；方向键说出文件夹、它是展开还是折叠，以及它的级别。\n树中的右箭头：展开文件夹。\n树中的左箭头：折叠文件夹。\n%1：整行。\n%2：脚本按键列表。
msgTcAppHelp=Total Commander 的 JAWS 脚本，版本 %1。脚本缩短文件列表和文件夹树中朗读的内容，使 Total Commander 的对话框、Lister、按内容比较和同步文件夹可用，并添加用于列、路径和状态栏的按键。要查看按键列表，请按 %2。
