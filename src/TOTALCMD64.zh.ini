msgTcSyncHelp=同步文件夹\n结果中的方向键：文件名和关系：相同、不同、从左到右、从右到左、仅左侧、仅右侧、尚未比较或跳过。\n%1：带大小和日期的整行。\n空格：更改该行的复制方向或将其关闭（跳过）。Total Commander 对已更改行的提示由 JAWS 原样朗读。\nControl+Shift+L：显示从左到右。\nControl+Shift+E：显示相同。\nControl+Shift+N：显示不同。\nControl+Shift+R：显示从右到左。\nControl+Shift+D：显示重复。\nControl+Shift+S：显示单个。\n每个这些键之后：Total Commander 的状态栏，带显示和隐藏的数量。\n同步按钮：带复制方向及其目标文件夹的对话框。
msgTcCompareHelp=按内容比较\n打开窗口，比较：左侧文件、右侧文件和 Total Commander 的状态栏。\n编辑：请先按它；窗格随后获得文本光标。\n下一个差异，上一个差异：编辑时两个文件中的行，先左侧；没有该行的一侧为 "blank"。\n方向键：朗读各行。\n编辑之外：只有状态栏，因为那里无法知道当前是哪个差异。\n长行：按窗格显示的长度朗读。\n%1：哪个文件在左、哪个在右，以及状态栏。
