msgTcHotKeyHelp=Total Commander 脚本按键\n%1 到 %2：焦点项目名称之后的各列，带表头中的列标题，按 Total Commander 显示的顺序。适用于每种视图和您的自定义列。在详细信息视图中：1 大小，2 日期和时间，3 属性。快速按两次时，在虚拟查看器中显示该项目的所有列，每行一列，光标位于所请求的列。\n%3：活动面板的路径；快速按两次时复制到剪贴板。\n%8：哪个面板是活动的。\n%4：项目的整行，带位置。\n%5：活动面板的状态栏；在进度窗口中为进度摘要；在 Lister 中为文件中的位置（百分比）。\n%9：另一个面板的状态栏和可用空间，例如在复制前检查目标。\n%6：在 Total Commander 的对话框中朗读整个对话框；在按内容比较窗口中朗读两个文件和状态栏。\n%7：脚本版本。
msgTcInsertHelpSelect=选择项目：%1，%2（可在 Quick Settings 中更改）。
msgTcInsertHelpNone=选择项目：空格（可在 Quick Settings 中更改）。
