msgTcListerHelp=Lister\nOtevření Listeru: název souboru.\nN, Alt+šipka vpravo: další soubor, s názvem.\nP, Alt+šipka vlevo: předchozí soubor, s názvem.\n1 až 8: režim zobrazení.\nF7, Control+F: hledání; potom celý řádek s nalezeným.\nF3, F5, Shift+F7: další výskyt, s řádkem.\nShift+F3, Shift+F5: předchozí výskyt, s řádkem.\nF2: znovu načte soubor, se zvukem.\nF6: textový kurzor zapnut nebo vypnut. Šipky čtou text jen tehdy, když je zapnut, a Total Commander si to pamatuje.\nF11: maximalizované okno zapnuto nebo vypnuto.\nAlt+Enter: celá obrazovka zapnuta nebo vypnuta.\nPlus, minus: větší nebo menší písmo, se zvukem a novou velikostí.\nControl+0: uložená velikost písma.\n%2: pozice v souboru v procentech.\nZvuk a video: posuvníky mlčí během přehrávání a mluví, když s nimi pohnete.\nTab: přechází mezi posuvníkem pozice a hlasitosti.\nShift nebo Control se šipkami na posuvníku: jdou do Listeru, ne do JAWS.\n%1: seznam kláves skriptů.
