msgTcHotKeyHelp=Klávesové zkratky skriptů pro Total Commander\n%1 až %2: sloupce za názvem položky v fokusu, s nadpisem sloupce ze záhlaví, v pořadí, v jakém je Total Commander zobrazuje. Sledují každé zobrazení i vaše vlastní sloupce. V zobrazení Podrobnosti: 1 velikost, 2 datum a čas, 3 atributy. Stisknuto dvakrát rychle zobrazí všechny sloupce položky ve virtuálním prohlížeči, jeden na řádek, s kurzorem na požadovaném sloupci.\n%3: cesta aktivního panelu; stisknuto dvakrát rychle ji zkopíruje do schránky.\n%8: který panel je aktivní.\n%4: celý řádek položky, s pozicí.\n%5: stavový řádek aktivního panelu; v okně průběhu souhrn průběhu; v Listeru pozice v souboru v procentech.\n%9: stavový řádek a volné místo druhého panelu, např. pro kontrolu cíle před kopírováním.\n%6: v dialozích Total Commanderu čte celý dialog; v okně porovnání podle obsahu oba soubory a stavový řádek.\n%7: verze skriptů.
