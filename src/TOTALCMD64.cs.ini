msgTcSyncHelp=Synchronizace složek\nŠipky ve výsledcích: název souboru a vztah: shodné, rozdílné, zleva doprava, zprava doleva, pouze vlevo, pouze vpravo, dosud neporovnáno nebo přeskočit.\n%1: celý řádek s velikostmi a daty.\nMezerník: mění směr kopírování řádku nebo jej vypíná (přeskočit). Oznámení Total Commanderu o změněném řádku čte JAWS tak, jak je.\nControl+Shift+L: zobrazit zleva doprava.\nControl+Shift+E: zobrazit shodné.\nControl+Shift+N: zobrazit rozdílné.\nControl+Shift+R: zobrazit zprava doleva.\nControl+Shift+D: zobrazit duplicitní.\nControl+Shift+S: zobrazit jednotlivé.\nPo každé z těchto kláves: stavový řádek Total Commanderu s počtem zobrazených a skrytých.\nTlačítko Synchronizovat: dialog se směry kopírování a jejich cílovými složkami.
msgTcCompareHelp=Porovnání podle obsahu\nOtevření okna, Porovnat: levý soubor, pravý soubor a stavový řádek Total Commanderu.\nÚpravy: stiskněte nejprve; panely pak dostanou textový kurzor.\nDalší rozdíl, Předchozí rozdíl: v úpravách řádek z obou souborů, nejprve levý; "blank" pro stranu bez tohoto řádku.\nŠipky: čtou řádky.\nMimo úpravy: jen stavový řádek, protože tam nelze zjistit, který rozdíl je aktuální.\nDlouhé řádky: čtou se, nakolik je panel zobrazuje.\n%1: který soubor je levý a který pravý, a stavový řádek.
