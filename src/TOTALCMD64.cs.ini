msgTcListHelp=Seznam souborů\nŠipky: název položky a u označených položek i "selected".\n"..": i složka, do které vede.\nMezerník: označí položku nebo zruší označení.\nF2, Control+R: znovu načtou panel, se zvukem.\nControl+F8: strom složek; šipky řeknou složku, zda je otevřená nebo zavřená, a její úroveň.\nŠipka vpravo ve stromu: otevře složku.\nŠipka vlevo ve stromu: zavře složku.\n%1: celý řádek.\n%2: seznam kláves skriptů.
msgTcAppHelp=Skripty JAWS pro Total Commander, verze %1. Skripty zkracují to, co se čte v seznamu souborů a ve stromu složek, zpřístupňují dialogy Total Commanderu, Lister, porovnání podle obsahu a synchronizaci složek a přidávají klávesy pro sloupce, cestu a stavové řádky. Seznam kláves zobrazíte stisknutím %2.
