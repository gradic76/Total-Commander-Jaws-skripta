msgTcListerHelp=Lister\nOtvaranje Listera: ime datoteke.\nN, Alt+strelica desno: sledeća datoteka, sa imenom.\nP, Alt+strelica levo: prethodna datoteka, sa imenom.\n1 do 8: način prikaza.\nF7, Control+F: pretraga; zatim ceo red sa pronađenim.\nF3, F5, Shift+F7: sledeće pronađeno, sa redom.\nShift+F3, Shift+F5: prethodno pronađeno, sa redom.\nF2: ponovo učitava datoteku, uz zvuk.\nF6: tekstualni kursor uključen ili isključen. Strelice čitaju tekst samo dok je uključen, a Total Commander to pamti.\nF11: uvećan prozor uključen ili isključen.\nAlt+Enter: ceo ekran uključen ili isključen.\nPlus, minus: veća ili manja slova, uz zvuk i novu veličinu.\nControl+0: sačuvana veličina slova.\n%2: položaj u datoteci u procentima.\nZvuk i video: klizači ćute tokom reprodukcije i govore kad ih pomerite.\nTab: prelazi između klizača položaja i jačine zvuka.\nShift ili Control sa strelicama na klizaču: idu Listeru, a ne JAWS-u.\n%1: spisak tastera skripti.
