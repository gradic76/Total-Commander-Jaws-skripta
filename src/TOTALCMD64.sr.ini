msgTcHotKeyHelp=Tasterske prečice skripte za Total Commander\n%1 do %2: kolone posle imena stavke u fokusu, sa naslovom kolone iz zaglavlja, redom kojim ih Total Commander prikazuje. Prate svaki prikaz i vaše sopstvene kolone. U punom prikazu: 1 veličina, 2 datum i vreme, 3 atributi. Pritisnuto dvaput brzo, prikazuje sve kolone stavke u preglednom prozoru, jednu po redu, sa kursorom na traženoj koloni.\n%3: putanja aktivnog panela; pritisnuto dvaput brzo, kopira se u klipbord.\n%8: koji je panel aktivan.\n%4: ceo red stavke, sa položajem.\n%5: statusna linija aktivnog panela; u prozoru napretka rezime napretka; u Listeru položaj u datoteci u procentima.\n%9: statusna linija i slobodan prostor drugog panela, npr. za proveru odredišta pre kopiranja.\n%6: u dijalozima Total Commandera čita ceo dijalog; u prozoru poređenja po sadržaju obe datoteke i statusnu liniju.\n%7: verzija skripti.
