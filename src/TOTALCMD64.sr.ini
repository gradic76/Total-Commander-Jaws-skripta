msgTcListHelp=Spisak datoteka\nStrelice: ime stavke, a za označene stavke i "selected".\n"..": i fascikla u koju vodi.\nRazmaknica: označava stavku ili uklanja oznaku.\nF2, Control+R: ponovo čitaju panel, uz zvuk.\nControl+F8: stablo fascikli; strelice kažu fasciklu, da li je otvorena ili zatvorena i njen nivo.\nStrelica desno u stablu: otvara fasciklu.\nStrelica levo u stablu: zatvara fasciklu.\n%1: ceo red.\n%2: spisak tastera skripti.
msgTcAppHelp=Total Commander JAWS skripte, verzija %1. Skripte skraćuju ono što se izgovara u spisku datoteka i stablu fascikli, čine upotrebljivim dijaloge Total Commandera, Lister, poređenje po sadržaju i sinhronizaciju fascikli i dodaju tastere za kolone, putanju i statusne linije. Za spisak tastera pritisnite %2.
