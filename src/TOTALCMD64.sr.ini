msgTcSyncHelp=Sinhronizacija fascikli\nStrelice u rezultatima: ime datoteke i odnos: jednako, različito, sleva nadesno, zdesna nalevo, samo levo, samo desno, još nije upoređeno ili preskoči.\n%1: ceo red sa veličinama i datumima.\nRazmaknica: menja smer kopiranja reda ili ga isključuje (preskoči). Najavu promenjenog reda Total Commandera JAWS čita onakvu kakva jeste.\nControl+Shift+L: prikaži sleva nadesno.\nControl+Shift+E: prikaži jednake.\nControl+Shift+N: prikaži različite.\nControl+Shift+R: prikaži zdesna nalevo.\nControl+Shift+D: prikaži duplikate.\nControl+Shift+S: prikaži pojedinačne.\nPosle svakog od tih tastera: statusna linija Total Commandera sa brojem prikazanih i skrivenih.\nDugme za sinhronizaciju: dijalog sa smerovima kopiranja i njihovim odredišnim fasciklama.
msgTcCompareHelp=Poređenje po sadržaju\nOtvaranje prozora, Uporedi: leva datoteka, desna datoteka i statusna linija Total Commandera.\nUređivanje: prvo pritisnite; okna tada dobijaju tekstualni kursor.\nSledeća razlika, Prethodna razlika: u uređivanju red iz obe datoteke, najpre levi; "blank" za stranu bez tog reda.\nStrelice: čitaju redove.\nVan uređivanja: samo statusna linija, jer se tamo ne može znati koja je razlika trenutna.\nDugi redovi: čitaju se onoliko koliko ih okno prikazuje.\n%1: koja je datoteka leva, a koja desna, i statusnu liniju.
