msgTcListHelp=파일 목록\n화살표: 항목 이름, 표시된 항목은 "selected"도.\n"..": 이동할 폴더도.\n스페이스: 항목을 표시하거나 표시를 해제합니다.\nF2, Control+R: 패널을 다시 읽습니다, 소리와 함께.\nControl+F8: 폴더 트리. 화살표는 폴더, 열림 또는 닫힘, 수준을 말합니다.\n트리에서 오른쪽 화살표: 폴더를 엽니다.\n트리에서 왼쪽 화살표: 폴더를 닫습니다.\n%1: 전체 행.\n%2: 스크립트 키 목록.
msgTcAppHelp=Total Commander용 JAWS 스크립트, 버전 %1. 스크립트는 파일 목록과 폴더 트리에서 읽는 내용을 줄이고, Total Commander의 대화 상자, Lister, 내용으로 비교, 폴더 동기화를 사용할 수 있게 하며, 열, 경로, 상태 표시줄을 위한 키를 추가합니다. 키 목록을 보려면 %2을(를) 누르십시오.
msgTcProgressUnknown=진행 상황을 사용할 수 없음
msgTcTimeFormat=시간 형식
