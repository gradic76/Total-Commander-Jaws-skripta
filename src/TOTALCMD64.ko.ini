msgTcHotKeyHelp=Total Commander 스크립트 키\n%1에서 %2: 포커스된 항목 이름 뒤의 열, 머리글의 열 제목과 함께, Total Commander가 표시하는 순서대로. 모든 보기와 사용자 지정 열에 맞춰집니다. 자세히 보기에서: 1 크기, 2 날짜와 시간, 3 속성. 빠르게 두 번 누르면 항목의 모든 열을 가상 뷰어에 한 줄에 하나씩, 요청한 열에 커서를 두고 표시합니다.\n%3: 활성 패널의 경로. 빠르게 두 번 누르면 클립보드에 복사합니다.\n%8: 어느 패널이 활성인지.\n%4: 항목의 전체 행, 위치와 함께.\n%5: 활성 패널의 상태 표시줄. 진행 창에서는 진행 요약. Lister에서는 파일 안의 위치(백분율).\n%9: 다른 패널의 상태 표시줄과 여유 공간, 예를 들어 복사 전에 대상을 확인할 때.\n%6: Total Commander 대화 상자에서 전체 대화 상자를 읽습니다. 내용으로 비교 창에서는 두 파일과 상태 표시줄.\n%7: 스크립트 버전.
