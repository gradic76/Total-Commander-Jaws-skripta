; Total Commander JAWS scripts: messages in Korean
; Translated from TOTALCMD64.hr.ini by Claude (machine translation, not reviewed). %1, %2... are filled in by the scripts; \n is a line break.
; Total Commander's command and view names are taken from Korean TC (WCMD_KOR.MNU, WCMD_KOR.LNG), without the access keys.

