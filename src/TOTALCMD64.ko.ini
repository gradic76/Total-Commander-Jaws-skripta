msgTcSyncHelp=폴더 동기화\n결과에서 화살표: 파일 이름과 관계: 같음, 다름, 왼쪽에서 오른쪽, 오른쪽에서 왼쪽, 왼쪽만, 오른쪽만, 아직 비교 안 됨 또는 건너뛰기.\n%1: 크기와 날짜가 있는 전체 행.\n스페이스: 행의 복사 방향을 바꾸거나 끕니다 (건너뛰기). 변경된 행에 대한 Total Commander의 알림은 JAWS가 그대로 읽습니다.\nControl+Shift+L: 왼쪽에서 오른쪽 표시.\nControl+Shift+E: 같은 항목 표시.\nControl+Shift+N: 다른 항목 표시.\nControl+Shift+R: 오른쪽에서 왼쪽 표시.\nControl+Shift+D: 중복 표시.\nControl+Shift+S: 단독 표시.\n각 키 다음: 표시된 항목과 숨겨진 항목 수가 있는 Total Commander의 상태 표시줄.\n동기화 버튼: 복사 방향과 대상 폴더가 있는 대화 상자.
msgTcCompareHelp=내용으로 비교\n창 열기, 비교: 왼쪽 파일, 오른쪽 파일과 Total Commander의 상태 표시줄.\n편집: 먼저 누르십시오. 그러면 창에 텍스트 커서가 생깁니다.\n다음 차이, 이전 차이: 편집 중 두 파일의 행, 왼쪽 먼저. 그 행이 없는 쪽은 "blank".\n화살표: 행을 읽습니다.\n편집 밖에서: 상태 표시줄만, 거기서는 현재 차이를 알 수 없기 때문입니다.\n긴 행: 창에 보이는 만큼 읽습니다.\n%1: 어느 파일이 왼쪽이고 어느 파일이 오른쪽인지와 상태 표시줄.
