msgTcListerHelp=Lister\nLister 열기: 파일 이름.\nN, Alt+오른쪽 화살표: 다음 파일, 이름과 함께.\nP, Alt+왼쪽 화살표: 이전 파일, 이름과 함께.\n1에서 8: 보기 모드.\nF7, Control+F: 찾기. 그다음 찾은 내용이 있는 전체 행.\nF3, F5, Shift+F7: 다음 찾은 항목, 행과 함께.\nShift+F3, Shift+F5: 이전 찾은 항목, 행과 함께.\nF2: 파일을 다시 불러옵니다, 소리와 함께.\nF6: 텍스트 커서 켜기 또는 끄기. 화살표는 켜져 있을 때만 텍스트를 읽으며, Total Commander가 이를 기억합니다.\nF11: 최대화 창 켜기 또는 끄기.\nAlt+Enter: 전체 화면 켜기 또는 끄기.\n더하기, 빼기: 글꼴 크게 또는 작게, 소리와 새 크기와 함께.\nControl+0: 저장된 글꼴 크기.\n%2: 파일 안의 위치(백분율).\n오디오와 비디오: 슬라이더는 재생 중에는 조용하고 움직이면 말합니다.\nTab: 위치 슬라이더와 볼륨 슬라이더 사이를 이동합니다.\n슬라이더에서 Shift 또는 Control과 화살표: JAWS가 아니라 Lister로 갑니다.\n%1: 스크립트 키 목록.
