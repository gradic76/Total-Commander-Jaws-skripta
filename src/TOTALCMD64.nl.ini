msgTcHotKeyHelp=Scripttoetsen voor Total Commander\n%1 tot %2: de kolommen na de naam van het item met de focus, met de kolomtitel uit de kop, in de volgorde waarin Total Commander ze toont. Ze volgen elke weergave en uw eigen kolommen. In de weergave Lang: 1 grootte, 2 datum en tijd, 3 attributen. Twee keer snel ingedrukt, toont alle kolommen van het item in de virtuele weergave, één per regel, met de cursor op de gevraagde kolom.\n%3: pad van het actieve paneel; twee keer snel ingedrukt, wordt het naar het klembord gekopieerd.\n%8: welk paneel actief is.\n%4: de hele regel van het item, met de positie.\n%5: statusregel van het actieve paneel; in het voortgangsvenster een samenvatting van de voortgang; in Lister de positie in het bestand in procenten.\n%9: statusregel en vrije ruimte van het andere paneel, bijv. om het doel te controleren vóór het kopiëren.\n%6: in de dialogen van Total Commander leest het de hele dialoog; in het venster Vergelijken op inhoud beide bestanden en de statusregel.\n%7: versie van de scripts.
