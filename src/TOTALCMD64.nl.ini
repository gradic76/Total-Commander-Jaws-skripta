msgTcSyncHelp=Mappen synchroniseren\nPijltjestoetsen in de resultaten: de bestandsnaam en de relatie: gelijk, verschillend, van links naar rechts, van rechts naar links, alleen links, alleen rechts, nog niet vergeleken of overslaan.\n%1: de hele regel met groottes en datums.\nSpatie: wijzigt de kopieerrichting van de regel of schakelt die uit (overslaan). De melding van Total Commander over de gewijzigde regel leest JAWS zoals die is.\nControl+Shift+L: van links naar rechts tonen.\nControl+Shift+E: gelijke tonen.\nControl+Shift+N: verschillende tonen.\nControl+Shift+R: van rechts naar links tonen.\nControl+Shift+D: dubbele tonen.\nControl+Shift+S: enkele tonen.\nNa elk van deze toetsen: de statusregel van Total Commander met het aantal getoonde en verborgen.\nKnop Synchroniseren: een dialoog met de kopieerrichtingen en hun doelmappen.
msgTcCompareHelp=Vergelijken op inhoud\nBij het openen van het venster, Vergelijken: het linkerbestand, het rechterbestand en de statusregel van Total Commander.\nBewerken: druk er eerst op; de vensterdelen krijgen dan een tekstcursor.\nVolgend verschil, Vorig verschil: bij bewerken de regel uit beide bestanden, eerst de linker; "blank" voor een kant zonder die regel.\nPijltjestoetsen: lezen de regels.\nBuiten bewerken: alleen de statusregel, omdat daar niet bekend is welk verschil het huidige is.\nLange regels: worden gelezen zover het vensterdeel ze toont.\n%1: welk bestand links is en welk rechts, en de statusregel.
