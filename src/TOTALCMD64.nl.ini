msgTcListHelp=Bestandslijst\nPijltjestoetsen: de naam van het item, en bij gemarkeerde items ook "selected".\n"..": ook de map waar het naartoe leidt.\nSpatie: markeert het item of heft de markering op.\nF2, Control+R: lezen het paneel opnieuw in, met een geluid.\nControl+F8: mappenboom; de pijltjestoetsen zeggen de map, of die open of dicht is, en het niveau.\nPijl rechts in de boom: opent de map.\nPijl links in de boom: sluit de map.\n%1: de hele regel.\n%2: de lijst met scripttoetsen.
msgTcAppHelp=JAWS-scripts voor Total Commander, versie %1. De scripts korten in wat er in de bestandslijst en de mappenboom wordt uitgesproken, maken de dialogen van Total Commander, Lister, vergelijken op inhoud en mappen synchroniseren bruikbaar, en voegen toetsen toe voor kolommen, pad en statusregels. Voor de lijst met toetsen drukt u op %2.
