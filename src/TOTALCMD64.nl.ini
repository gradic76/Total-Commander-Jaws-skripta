msgTcListerHelp=Lister\nOpenen van Lister: de bestandsnaam.\nN, Alt+Pijl rechts: het volgende bestand, met naam.\nP, Alt+Pijl links: het vorige bestand, met naam.\n1 tot 8: de weergavemodus.\nF7, Control+F: zoeken; daarna de hele regel met het gevondene.\nF3, F5, Shift+F7: de volgende vondst, met de regel.\nShift+F3, Shift+F5: de vorige vondst, met de regel.\nF2: laadt het bestand opnieuw, met een geluid.\nF6: tekstcursor aan of uit. De pijltjestoetsen lezen de tekst alleen terwijl die aan staat, en Total Commander onthoudt dat.\nF11: gemaximaliseerd venster aan of uit.\nAlt+Enter: volledig scherm aan of uit.\nPlus, min: grotere of kleinere letters, met een geluid en de nieuwe grootte.\nControl+0: de opgeslagen lettergrootte.\n%2: positie in het bestand in procenten.\nAudio en video: de schuifregelaars zwijgen tijdens het afspelen en spreken wanneer u ze verplaatst.\nTab: wisselt tussen de schuifregelaars voor positie en volume.\nShift of Control met de pijltjestoetsen op een schuifregelaar: gaan naar Lister, niet naar JAWS.\n%1: de lijst met scripttoetsen.
