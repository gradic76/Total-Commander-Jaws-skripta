msgTcHotKeyHelp=Teclas de los scripts para Total Commander\n%1 a %2: las columnas tras el nombre del elemento con el foco, con el título de columna de la cabecera, en el orden en que Total Commander las muestra. Siguen cualquier vista y sus propias columnas. En la vista Completo: 1 tamaño, 2 fecha y hora, 3 atributos. Pulsado dos veces rápidamente, muestra todas las columnas del elemento en el visor virtual, una por línea, con el cursor en la columna pedida.\n%3: ruta del panel activo; pulsado dos veces rápidamente, la copia al portapapeles.\n%8: qué panel está activo.\n%4: la fila completa del elemento, con su posición.\n%5: línea de estado del panel activo; en la ventana de progreso, un resumen del progreso; en Lister, la posición en el archivo en porcentaje.\n%9: línea de estado y espacio libre del otro panel, p. ej. para comprobar el destino antes de copiar.\n%6: en los diálogos de Total Commander lee el diálogo completo; en la ventana Comparar por contenido, ambos archivos y la línea de estado.\n%7: versión de los scripts.
