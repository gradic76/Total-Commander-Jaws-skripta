msgTcListHelp=Lista de archivos\nFlechas: el nombre del elemento y, en los marcados, también "selected".\n"..": también la carpeta a la que lleva.\nEspacio: marca el elemento o quita la marca.\nF2, Control+R: vuelven a leer el panel, con un sonido.\nControl+F8: árbol de carpetas; las flechas dicen la carpeta, si está abierta o cerrada, y su nivel.\nFlecha derecha en el árbol: abre la carpeta.\nFlecha izquierda en el árbol: cierra la carpeta.\n%1: la fila completa.\n%2: la lista de teclas de los scripts.
msgTcAppHelp=Scripts de JAWS para Total Commander, versión %1. Los scripts acortan lo que se lee en la lista de archivos y el árbol de carpetas, hacen utilizables los diálogos de Total Commander, Lister, la comparación por contenido y la sincronización de directorios, y añaden teclas para columnas, ruta y líneas de estado. Para la lista de teclas, pulse %2.
