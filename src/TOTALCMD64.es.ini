msgTcListerHelp=Lister\nAl abrir Lister: el nombre del archivo.\nN, Alt+Flecha derecha: el archivo siguiente, con su nombre.\nP, Alt+Flecha izquierda: el archivo anterior, con su nombre.\n1 a 8: el modo de visualización.\nF7, Control+F: buscar; después la línea completa con lo encontrado.\nF3, F5, Shift+F7: la siguiente coincidencia, con su línea.\nShift+F3, Shift+F5: la coincidencia anterior, con su línea.\nF2: vuelve a cargar el archivo, con un sonido.\nF6: cursor de texto activado o desactivado. Las flechas leen el texto solo mientras está activado, y Total Commander lo recuerda.\nF11: ventana maximizada activada o desactivada.\nAlt+Enter: pantalla completa activada o desactivada.\nMás, menos: letra más grande o más pequeña, con un sonido y el nuevo tamaño.\nControl+0: el tamaño de letra guardado.\n%2: posición en el archivo en porcentaje.\nAudio y vídeo: los controles deslizantes callan durante la reproducción y hablan cuando los mueve.\nTab: pasa entre los controles de posición y de volumen.\nShift o Control con las flechas en un control deslizante: van a Lister, no a JAWS.\n%1: la lista de teclas de los scripts.
