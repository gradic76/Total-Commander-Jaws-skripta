msgTcSyncHelp=Sincronizar directorios\nFlechas en los resultados: el nombre del archivo y su relación: igual, distinto, de izquierda a derecha, de derecha a izquierda, solo a la izquierda, solo a la derecha, aún no comparado u omitir.\n%1: la fila completa con tamaños y fechas.\nEspacio: cambia la dirección de copia de la fila o la desactiva (omitir). JAWS lee tal cual el aviso de Total Commander sobre la fila cambiada.\nControl+Shift+L: mostrar de izquierda a derecha.\nControl+Shift+E: mostrar iguales.\nControl+Shift+N: mostrar distintos.\nControl+Shift+R: mostrar de derecha a izquierda.\nControl+Shift+D: mostrar duplicados.\nControl+Shift+S: mostrar únicos.\nTras cada una de estas teclas: la línea de estado de Total Commander con el número de mostrados y ocultos.\nBotón Sincronizar: un diálogo con las direcciones de copia y sus carpetas de destino.
msgTcCompareHelp=Comparar por contenido\nAl abrir la ventana, Comparar: el archivo izquierdo, el archivo derecho y la línea de estado de Total Commander.\nEditar: púlselo primero; los paneles reciben entonces un cursor de texto.\nDiferencia siguiente, Diferencia anterior: al editar, la línea de ambos archivos, primero la izquierda; "blank" para un lado sin esa línea.\nFlechas: leen las líneas.\nFuera de la edición: solo la línea de estado, porque allí no se puede saber cuál es la diferencia actual.\nLíneas largas: se leen hasta donde el panel las muestra.\n%1: qué archivo es el izquierdo y cuál el derecho, y la línea de estado.
