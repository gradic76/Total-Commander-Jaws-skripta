msgTcHotKeyHelp=Skripttangenter för Total Commander\n%1 till %2: kolumnerna efter namnet på objektet i fokus, med kolumnrubriken från huvudet, i den ordning Total Commander visar dem. De följer varje vy och dina egna kolumner. I vyn Lång: 1 storlek, 2 datum och tid, 3 attribut. Tryckt två gånger snabbt visas alla objektets kolumner i den virtuella visaren, en per rad, med markören på den begärda kolumnen.\n%3: sökvägen för den aktiva panelen; tryckt två gånger snabbt kopieras den till urklipp.\n%8: vilken panel som är aktiv.\n%4: hela objektets rad, med position.\n%5: statusraden för den aktiva panelen; i förloppsfönstret en sammanfattning av förloppet; i Lister positionen i filen i procent.\n%9: statusrad och ledigt utrymme för den andra panelen, t.ex. för att kontrollera målet före kopiering.\n%6: i Total Commanders dialoger läses hela dialogen; i fönstret Jämför efter innehåll båda filerna och statusraden.\n%7: skriptens version.
