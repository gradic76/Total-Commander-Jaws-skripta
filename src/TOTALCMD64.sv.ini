msgTcSyncHelp=Synkronisera mappar\nPiltangenter i resultaten: filnamnet och relationen: lika, olika, från vänster till höger, från höger till vänster, bara vänster, bara höger, inte jämförd ännu eller hoppa över.\n%1: hela raden med storlekar och datum.\nBlanksteg: ändrar kopieringsriktningen för raden eller stänger av den (hoppa över). Total Commanders eget meddelande om den ändrade raden läser JAWS som det är.\nControl+Shift+L: visa från vänster till höger.\nControl+Shift+E: visa lika.\nControl+Shift+N: visa olika.\nControl+Shift+R: visa från höger till vänster.\nControl+Shift+D: visa dubbletter.\nControl+Shift+S: visa enstaka.\nEfter var och en av dessa tangenter: Total Commanders statusrad med antal visade och dolda.\nKnappen Synkronisera: en dialog med kopieringsriktningarna och deras målmappar.
msgTcCompareHelp=Jämför efter innehåll\nÖppning av fönstret, Jämför: vänster fil, höger fil och Total Commanders statusrad.\nRedigera: tryck på den först; rutorna får då en textmarkör.\nNästa skillnad, Föregående skillnad: vid redigering raden från båda filerna, vänster först; "blank" för en sida utan den raden.\nPiltangenter: läser raderna.\nUtanför redigering: bara statusraden, eftersom det där inte går att veta vilken skillnad som är aktuell.\nLånga rader: läses så långt rutan visar dem.\n%1: vilken fil som är vänster och vilken höger, och statusraden.
