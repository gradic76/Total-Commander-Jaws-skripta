msgTcListHelp=Fillista\nPiltangenter: objektets namn, och för markerade objekt även "selected".\n"..": även mappen den leder till.\nBlanksteg: markerar objektet eller tar bort markeringen.\nF2, Control+R: läser in panelen igen, med ett ljud.\nControl+F8: mappträd; piltangenterna säger mappen, om den är öppen eller stängd, och dess nivå.\nHögerpil i trädet: öppnar mappen.\nVänsterpil i trädet: stänger mappen.\n%1: hela raden.\n%2: listan över skripttangenter.
msgTcAppHelp=JAWS-skript för Total Commander, version %1. Skripten kortar det som läses upp i fillistan och mappträdet, gör Total Commanders dialoger, Lister, jämförelse efter innehåll och synkronisering av mappar användbara, och lägger till tangenter för kolumner, sökväg och statusrader. Tryck %2 för listan över tangenter.
