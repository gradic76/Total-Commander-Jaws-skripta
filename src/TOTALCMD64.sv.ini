msgTcListerHelp=Lister\nÖppning av Lister: filnamnet.\nN, Alt+Högerpil: nästa fil, med namn.\nP, Alt+Vänsterpil: föregående fil, med namn.\n1 till 8: visningsläge.\nF7, Control+F: sökning; därefter hela raden med träffen.\nF3, F5, Shift+F7: nästa träff, med raden.\nShift+F3, Shift+F5: föregående träff, med raden.\nF2: läser in filen igen, med ett ljud.\nF6: textmarkör på eller av. Piltangenterna läser texten bara medan den är på, och Total Commander kommer ihåg det.\nF11: maximerat fönster på eller av.\nAlt+Enter: helskärm på eller av.\nPlus, minus: större eller mindre teckensnitt, med ett ljud och den nya storleken.\nControl+0: den sparade teckenstorleken.\n%2: position i filen i procent.\nLjud och video: reglagen är tysta under uppspelning och talar när du flyttar dem.\nTab: växlar mellan reglagen för position och volym.\nShift eller Control med piltangenterna på ett reglage: går till Lister, inte till JAWS.\n%1: listan över skripttangenter.
