msgTcListerHelp=Lister\nOtvaranje Listera: ime datoteke.\nN, Alt+strelica desno: sljedeća datoteka, s imenom.\nP, Alt+strelica lijevo: prethodna datoteka, s imenom.\n1 do 8: način prikaza.\nF7, Control+F: traženje; zatim cijeli redak s pronađenim.\nF3, F5, Shift+F7: sljedeće pronađeno, s retkom.\nShift+F3, Shift+F5: prethodno pronađeno, s retkom.\nF2: ponovno učitava datoteku, uz zvuk.\nF6: tekstni kursor uključen ili isključen. Strelice čitaju tekst samo dok je uključen, a Total Commander to pamti.\nF11: uvećani prozor uključen ili isključen.\nAlt+Enter: cijeli zaslon uključen ili isključen.\nPlus, minus: veća ili manja slova, uz zvuk i novu veličinu.\nControl+0: spremljena veličina slova.\n%2: položaj u datoteci u postocima.\nZvuk i video: klizači šute dok traje reprodukcija i govore kad ih pomaknete.\nTab: prelazi između klizača položaja i glasnoće.\nShift ili Control sa strelicama na klizaču: idu Listeru, a ne JAWS-u.\n%1: popis tipki skripti.
