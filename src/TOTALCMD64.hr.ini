msgTcHotKeyHelp=Tipkovni prečaci skripte za Total Commander\n%1 do %2: stupci iza imena stavke u fokusu, s naslovom stupca iz zaglavlja, redom kojim ih Total Commander prikazuje. Prate svaki prikaz i vaše vlastite stupce. U prikazu svih atributa: 1 veličina, 2 datum i vrijeme, 3 atributi. Pritisnuto dvaput brzo, prikazuje sve stupce stavke u preglednom prozoru, jedan po retku, s kursorom na traženom stupcu.\n%3: putanja aktivne ploče; pritisnuto dvaput brzo, kopira se u međuspremnik.\n%8: koja je ploča aktivna.\n%4: cijeli redak stavke, s položajem.\n%5: statusni redak aktivne ploče; u prozoru napretka sažetak napretka; u Listeru položaj u datoteci u postocima.\n%9: statusni redak i slobodni prostor druge ploče, npr. za provjeru odredišta prije kopiranja.\n%6: u dijalozima Total Commandera čita cijeli dijalog; u prozoru usporedbe po sadržaju obje datoteke i statusni redak.\n%7: verzija skripti.
