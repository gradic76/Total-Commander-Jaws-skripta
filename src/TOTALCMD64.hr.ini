msgTcSyncHelp=Usklađivanje mapa\nStrelice u rezultatima: ime datoteke i odnos: jednako, različito, slijeva nadesno, zdesna nalijevo, samo lijevo, samo desno, još nije uspoređeno ili preskoči.\n%1: cijeli redak s veličinama i datumima.\nRazmaknica: mijenja smjer kopiranja retka ili ga isključuje (preskoči). Total Commanderovu najavu promijenjenog retka JAWS čita onakvu kakva jest.\nControl+Shift+L: prikaži slijeva nadesno.\nControl+Shift+E: prikaži jednake.\nControl+Shift+N: prikaži različite.\nControl+Shift+R: prikaži zdesna nalijevo.\nControl+Shift+D: prikaži dvostruke.\nControl+Shift+S: prikaži jednostruke.\nNakon svake od tih tipki: statusni redak Total Commandera s brojem prikazanih i skrivenih.\nTipka za usklađivanje: dijalog sa smjerovima kopiranja i njihovim odredišnim mapama.
msgTcCompareHelp=Usporedba po sadržaju\nOtvaranje prozora, Usporedi: lijeva datoteka, desna datoteka i statusni redak Total Commandera.\nUređivanje: prvo pritisnite; ploče tada dobivaju tekstni kursor.\nSljedeća razlika, Prethodna razlika: u uređivanju redak iz obje datoteke, najprije lijevi; "blank" za stranu bez tog retka.\nStrelice: čitaju retke.\nIzvan uređivanja: samo statusni redak, jer se ondje ne može znati koja je razlika trenutna.\nDugi retci: čitaju se koliko ih ploča prikazuje.\n%1: koja je datoteka lijeva, a koja desna, i statusni redak.
