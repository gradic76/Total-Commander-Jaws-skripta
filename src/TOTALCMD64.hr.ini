msgTcListHelp=Popis datoteka\nStrelice: ime stavke, a za označene stavke i "selected".\n"..": i mapa u koju vodi.\nRazmaknica: označava stavku ili uklanja oznaku.\nF2, Control+R: ponovno čitaju ploču, uz zvuk.\nControl+F8: stablo mapa; strelice kažu mapu, je li otvorena ili zatvorena i njezinu razinu.\nStrelica desno u stablu: otvara mapu.\nStrelica lijevo u stablu: zatvara mapu.\n%1: cijeli redak.\n%2: popis tipki skripti.
msgTcAppHelp=Total Commander JAWS skripte, verzija %1. Skripte skraćuju ono što se izgovara u popisu datoteka i stablu mapa, čine upotrebljivima dijaloge Total Commandera, Lister, usporedbu po sadržaju i usklađivanje mapa te dodaju tipke za stupce, putanju i statusne retke. Za popis tipki pritisnite %2.
