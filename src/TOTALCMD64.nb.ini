msgTcListHelp=Filliste\nPiltaster: navnet på elementet, og for merkede elementer også "selected".\n"..": også mappen den fører til.\nMellomrom: merker elementet eller fjerner merket.\nF2, Control+R: leser panelet på nytt, med en lyd.\nControl+F8: mappetre; piltastene sier mappen, om den er åpen eller lukket, og nivået.\nPil høyre i treet: åpner mappen.\nPil venstre i treet: lukker mappen.\n%1: hele raden.\n%2: listen over skripttaster.
msgTcAppHelp=JAWS-skript for Total Commander, versjon %1. Skriptene forkorter det som leses opp i fillisten og mappetreet, gjør Total Commanders dialoger, Lister, sammenligning etter innhold og synkronisering av mapper brukbare, og legger til taster for kolonner, bane og statuslinjer. Trykk %2 for listen over taster.
