msgTcListerHelp=Lister\nÅpning av Lister: filnavnet.\nN, Alt+Pil høyre: neste fil, med navn.\nP, Alt+Pil venstre: forrige fil, med navn.\n1 til 8: visningsmodus.\nF7, Control+F: søk; deretter hele linjen med treffet.\nF3, F5, Shift+F7: neste treff, med linjen.\nShift+F3, Shift+F5: forrige treff, med linjen.\nF2: laster inn filen på nytt, med en lyd.\nF6: tekstmarkør på eller av. Piltastene leser teksten bare mens den er på, og Total Commander husker det.\nF11: maksimert vindu på eller av.\nAlt+Enter: fullskjerm på eller av.\nPluss, minus: større eller mindre skrift, med en lyd og den nye størrelsen.\nControl+0: den lagrede skriftstørrelsen.\n%2: posisjon i filen i prosent.\nLyd og video: glidebryterne er stille under avspilling og snakker når du flytter dem.\nTab: veksler mellom glidebryterne for posisjon og volum.\nShift eller Control med piltastene på en glidebryter: går til Lister, ikke til JAWS.\n%1: listen over skripttaster.
