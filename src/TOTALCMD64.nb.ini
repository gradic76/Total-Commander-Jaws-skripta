msgTcSyncHelp=Synkroniser mapper\nPiltaster i resultatene: filnavnet og forholdet: lik, ulik, fra venstre til høyre, fra høyre til venstre, bare venstre, bare høyre, ikke sammenlignet ennå eller hopp over.\n%1: hele raden med størrelser og datoer.\nMellomrom: endrer kopieringsretningen for raden eller slår den av (hopp over). Total Commanders egen melding om den endrede raden leser JAWS slik den er.\nControl+Shift+L: vis fra venstre til høyre.\nControl+Shift+E: vis like.\nControl+Shift+N: vis ulike.\nControl+Shift+R: vis fra høyre til venstre.\nControl+Shift+D: vis duplikater.\nControl+Shift+S: vis enkeltstående.\nEtter hver av disse tastene: Total Commanders statuslinje med antall viste og skjulte.\nKnappen Synkroniser: en dialog med kopieringsretningene og målmappene deres.
msgTcCompareHelp=Sammenlign etter innhold\nÅpning av vinduet, Sammenlign: venstre fil, høyre fil og Total Commanders statuslinje.\nRediger: trykk på den først; rutene får da en tekstmarkør.\nNeste forskjell, Forrige forskjell: under redigering linjen fra begge filene, venstre først; "blank" for en side uten den linjen.\nPiltaster: leser linjene.\nUtenfor redigering: bare statuslinjen, fordi det der ikke kan vites hvilken forskjell som er gjeldende.\nLange linjer: leses så langt ruten viser dem.\n%1: hvilken fil som er venstre og hvilken høyre, og statuslinjen.
