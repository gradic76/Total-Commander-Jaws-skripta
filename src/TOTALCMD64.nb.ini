msgTcHotKeyHelp=Skripttaster for Total Commander\n%1 til %2: kolonnene etter navnet på elementet i fokus, med kolonnetittelen fra overskriften, i den rekkefølgen Total Commander viser dem. De følger hver visning og dine egne kolonner. I visningen Full info: 1 størrelse, 2 dato og tid, 3 attributter. Trykket to ganger raskt vises alle kolonnene til elementet i den virtuelle visningen, én per linje, med markøren på den ønskede kolonnen.\n%3: banen til det aktive panelet; trykket to ganger raskt kopieres den til utklippstavlen.\n%8: hvilket panel som er aktivt.\n%4: hele raden til elementet, med posisjon.\n%5: statuslinjen til det aktive panelet; i fremdriftsvinduet et sammendrag av fremdriften; i Lister posisjonen i filen i prosent.\n%9: statuslinje og ledig plass for det andre panelet, f.eks. for å sjekke målet før kopiering.\n%6: i Total Commanders dialoger leses hele dialogen; i vinduet Sammenlign etter innhold begge filene og statuslinjen.\n%7: skriptenes versjon.
