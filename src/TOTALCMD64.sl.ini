msgTcHotKeyHelp=Tipke skript za Total Commander\n%1 do %2: stolpci za imenom elementa v fokusu, z naslovom stolpca iz glave, v vrstnem redu, kot jih prikazuje Total Commander. Sledijo vsakemu prikazu in vašim lastnim stolpcem. V polnem prikazu: 1 velikost, 2 datum in čas, 3 atributi. Dvakrat hitro pritisnjeno prikaže vse stolpce elementa v navideznem pregledovalniku, enega na vrstico, s kazalcem na zahtevanem stolpcu.\n%3: pot aktivne plošče; dvakrat hitro pritisnjeno jo kopira v odložišče.\n%8: katera plošča je aktivna.\n%4: celotna vrstica elementa, s položajem.\n%5: statusna vrstica aktivne plošče; v oknu napredka povzetek napredka; v Listerju položaj v datoteki v odstotkih.\n%9: statusna vrstica in prosti prostor druge plošče, npr. za preverjanje cilja pred kopiranjem.\n%6: v pogovornih oknih Total Commanderja prebere celotno okno; v oknu primerjave po vsebini obe datoteki in statusno vrstico.\n%7: različica skript.
