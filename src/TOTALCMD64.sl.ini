msgTcListHelp=Seznam datotek\nPuščice: ime elementa, pri označenih elementih tudi "selected".\n"..": tudi mapa, v katero vodi.\nPreslednica: označi element ali odstrani oznako.\nF2, Control+R: znova prebereta ploščo, z zvokom.\nControl+F8: drevo map; puščice povedo mapo, ali je odprta ali zaprta, in njeno raven.\nPuščica desno v drevesu: odpre mapo.\nPuščica levo v drevesu: zapre mapo.\n%1: celotna vrstica.\n%2: seznam tipk skript.
msgTcAppHelp=Skripte JAWS za Total Commander, različica %1. Skripte skrajšajo to, kar se izgovori v seznamu datotek in drevesu map, omogočijo uporabo pogovornih oken Total Commanderja, Listerja, primerjave po vsebini in usklajevanja map ter dodajo tipke za stolpce, pot in statusne vrstice. Za seznam tipk pritisnite %2.
