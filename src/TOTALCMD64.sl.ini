msgTcListerHelp=Lister\nOdprtje Listerja: ime datoteke.\nN, Alt+puščica desno: naslednja datoteka, z imenom.\nP, Alt+puščica levo: prejšnja datoteka, z imenom.\n1 do 8: način prikaza.\nF7, Control+F: iskanje; nato celotna vrstica z najdenim.\nF3, F5, Shift+F7: naslednje najdeno, z vrstico.\nShift+F3, Shift+F5: prejšnje najdeno, z vrstico.\nF2: znova naloži datoteko, z zvokom.\nF6: besedilni kazalec vklopljen ali izklopljen. Puščice berejo besedilo samo, ko je vklopljen, in Total Commander si to zapomni.\nF11: povečano okno vklopljeno ali izklopljeno.\nAlt+Enter: celozaslonski način vklopljen ali izklopljen.\nPlus, minus: večja ali manjša pisava, z zvokom in novo velikostjo.\nControl+0: shranjena velikost pisave.\n%2: položaj v datoteki v odstotkih.\nZvok in video: drsniki med predvajanjem molčijo in spregovorijo, ko jih premaknete.\nTab: preklaplja med drsnikoma položaja in glasnosti.\nShift ali Control s puščicami na drsniku: gredo v Lister, ne v JAWS.\n%1: seznam tipk skript.
