msgTcSyncHelp=Usklajevanje map\nPuščice v rezultatih: ime datoteke in razmerje: enako, različno, z leve na desno, z desne na levo, samo levo, samo desno, še ni primerjano ali preskoči.\n%1: celotna vrstica z velikostmi in datumi.\nPreslednica: spremeni smer kopiranja vrstice ali jo izključi (preskoči). Obvestilo Total Commanderja o spremenjeni vrstici JAWS prebere takšno, kot je.\nControl+Shift+L: prikaži z leve na desno.\nControl+Shift+E: prikaži enake.\nControl+Shift+N: prikaži različne.\nControl+Shift+R: prikaži z desne na levo.\nControl+Shift+D: prikaži podvojene.\nControl+Shift+S: prikaži posamezne.\nPo vsaki od teh tipk: statusna vrstica Total Commanderja s številom prikazanih in skritih.\nGumb Uskladi: pogovorno okno s smermi kopiranja in njihovimi ciljnimi mapami.
msgTcCompareHelp=Primerjava po vsebini\nOdprtje okna, Primerjaj: leva datoteka, desna datoteka in statusna vrstica Total Commanderja.\nUrejanje: najprej ga pritisnite; podokni nato dobita besedilni kazalec.\nNaslednja razlika, Prejšnja razlika: pri urejanju vrstica iz obeh datotek, najprej leva; "blank" za stran brez te vrstice.\nPuščice: berejo vrstice.\nZunaj urejanja: samo statusna vrstica, ker tam ni mogoče vedeti, katera razlika je trenutna.\nDolge vrstice: berejo se, kolikor jih podokno prikaže.\n%1: katera datoteka je leva in katera desna, in statusna vrstica.
