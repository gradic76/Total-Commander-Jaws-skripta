msgTcListHelp=Lista de fișiere\nSăgeți: numele elementului, iar la elementele marcate și "selected".\n"..": și folderul spre care duce.\nSpațiu: marchează elementul sau elimină marcajul.\nF2, Control+R: recitesc panoul, cu un sunet.\nControl+F8: arborele de foldere; săgețile spun folderul, dacă este deschis sau închis, și nivelul său.\nSăgeată dreapta în arbore: deschide folderul.\nSăgeată stânga în arbore: închide folderul.\n%1: întregul rând.\n%2: lista tastelor scripturilor.
msgTcAppHelp=Scripturi JAWS pentru Total Commander, versiunea %1. Scripturile scurtează ceea ce se citește în lista de fișiere și în arborele de foldere, fac utilizabile dialogurile Total Commander, Lister, compararea după conținut și sincronizarea folderelor și adaugă taste pentru coloane, cale și liniile de stare. Pentru lista tastelor, apăsați %2.
