msgTcSyncHelp=Sincronizare foldere\nSăgeți în rezultate: numele fișierului și relația: egal, diferit, de la stânga la dreapta, de la dreapta la stânga, doar în stânga, doar în dreapta, încă necomparat sau sari peste.\n%1: întregul rând cu dimensiuni și date.\nSpațiu: schimbă direcția de copiere a rândului sau o dezactivează (sari peste). Anunțul Total Commander despre rândul modificat este citit de JAWS așa cum este.\nControl+Shift+L: arată de la stânga la dreapta.\nControl+Shift+E: arată egale.\nControl+Shift+N: arată diferite.\nControl+Shift+R: arată de la dreapta la stânga.\nControl+Shift+D: arată duplicate.\nControl+Shift+S: arată unice.\nDupă fiecare dintre aceste taste: linia de stare a Total Commander cu numărul celor afișate și ascunse.\nButonul Sincronizează: un dialog cu direcțiile de copiere și folderele lor de destinație.
msgTcCompareHelp=Comparare după conținut\nLa deschiderea ferestrei, Compară: fișierul din stânga, fișierul din dreapta și linia de stare a Total Commander.\nEditare: apăsați-l mai întâi; panourile primesc atunci un cursor de text.\nDiferența următoare, Diferența anterioară: în editare, rândul din ambele fișiere, întâi cel din stânga; "blank" pentru o parte fără acel rând.\nSăgeți: citesc rândurile.\nÎn afara editării: doar linia de stare, deoarece acolo nu se poate ști care diferență este cea curentă.\nRânduri lungi: se citesc atât cât le arată panoul.\n%1: care fișier este în stânga și care în dreapta, și linia de stare.
