msgTcListerHelp=Lister\nLa deschiderea Lister: numele fișierului.\nN, Alt+Săgeată dreapta: fișierul următor, cu numele.\nP, Alt+Săgeată stânga: fișierul anterior, cu numele.\n1 până la 8: modul de afișare.\nF7, Control+F: căutare; apoi întregul rând cu rezultatul.\nF3, F5, Shift+F7: rezultatul următor, cu rândul.\nShift+F3, Shift+F5: rezultatul anterior, cu rândul.\nF2: reîncarcă fișierul, cu un sunet.\nF6: cursor de text activat sau dezactivat. Săgețile citesc textul doar cât timp este activat, iar Total Commander reține asta.\nF11: fereastră maximizată activată sau dezactivată.\nAlt+Enter: ecran complet activat sau dezactivat.\nPlus, minus: font mai mare sau mai mic, cu un sunet și noua dimensiune.\nControl+0: dimensiunea de font salvată.\n%2: poziția în fișier în procente.\nAudio și video: glisoarele tac în timpul redării și vorbesc când le mutați.\nTab: trece între glisoarele de poziție și de volum.\nShift sau Control cu săgețile pe un glisor: merg la Lister, nu la JAWS.\n%1: lista tastelor scripturilor.
