msgTcHotKeyHelp=Tastele scripturilor pentru Total Commander\n%1 până la %2: coloanele de după numele elementului cu focus, cu titlul coloanei din antet, în ordinea în care Total Commander le afișează. Urmează orice afișare și propriile dumneavoastră coloane. În afișarea Complet: 1 dimensiune, 2 dată și oră, 3 atribute. Apăsat de două ori rapid, afișează toate coloanele elementului în vizualizatorul virtual, câte una pe rând, cu cursorul pe coloana cerută.\n%3: calea panoului activ; apăsat de două ori rapid, o copiază în clipboard.\n%8: care panou este activ.\n%4: întregul rând al elementului, cu poziția.\n%5: linia de stare a panoului activ; în fereastra de progres, un rezumat al progresului; în Lister, poziția în fișier în procente.\n%9: linia de stare și spațiul liber al celuilalt panou, de ex. pentru a verifica destinația înainte de copiere.\n%6: în dialogurile Total Commander citește întregul dialog; în fereastra de comparare după conținut, ambele fișiere și linia de stare.\n%7: versiunea scripturilor.
