msgTcSyncHelp=Синхронизация каталогов\nСтрелки в результатах: имя файла и отношение: одинаковые, разные, слева направо, справа налево, только слева, только справа, ещё не сравнено или пропустить.\n%1: вся строка с размерами и датами.\nПробел: меняет направление копирования строки или отключает её (пропустить). Сообщение Total Commander об изменённой строке JAWS читает как есть.\nControl+Shift+L: показать слева направо.\nControl+Shift+E: показать одинаковые.\nControl+Shift+N: показать разные.\nControl+Shift+R: показать справа налево.\nControl+Shift+D: показать дубликаты.\nControl+Shift+S: показать одиночные.\nПосле каждой из этих клавиш: строка состояния Total Commander с числом показанных и скрытых.\nКнопка Синхронизировать: диалог с направлениями копирования и их целевыми папками.
msgTcCompareHelp=Сравнение по содержимому\nПри открытии окна, Сравнить: левый файл, правый файл и строка состояния Total Commander.\nРедактирование: нажмите сначала её; панели тогда получают текстовый курсор.\nСледующее отличие, Предыдущее отличие: при редактировании строка из обоих файлов, сначала левая; "blank" для стороны без этой строки.\nСтрелки: читают строки.\nВне редактирования: только строка состояния, так как там нельзя узнать, какое отличие текущее.\nДлинные строки: читаются настолько, насколько их показывает панель.\n%1: какой файл левый, а какой правый, и строка состояния.
