msgTcHotKeyHelp=Клавиши скриптов для Total Commander\n%1 до %2: столбцы после имени элемента в фокусе, с заголовком столбца из шапки, в том порядке, в каком их показывает Total Commander. Работают в любом режиме и с вашими собственными столбцами. В подробном режиме: 1 размер, 2 дата и время, 3 атрибуты. При двойном быстром нажатии показывает все столбцы элемента в виртуальном просмотрщике, по одному в строке, с курсором на нужном столбце.\n%3: путь активной панели; при двойном быстром нажатии копирует его в буфер обмена.\n%8: какая панель активна.\n%4: вся строка элемента, с позицией.\n%5: строка состояния активной панели; в окне прогресса сводка прогресса; в Lister позиция в файле в процентах.\n%9: строка состояния и свободное место другой панели, например для проверки цели перед копированием.\n%6: в диалогах Total Commander читает весь диалог; в окне сравнения по содержимому оба файла и строку состояния.\n%7: версия скриптов.
