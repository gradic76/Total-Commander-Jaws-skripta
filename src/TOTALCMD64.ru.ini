msgTcListerHelp=Lister\nОткрытие Lister: имя файла.\nN, Alt+Стрелка вправо: следующий файл, с именем.\nP, Alt+Стрелка влево: предыдущий файл, с именем.\n1 до 8: режим просмотра.\nF7, Control+F: поиск; затем вся строка с найденным.\nF3, F5, Shift+F7: следующее найденное, со строкой.\nShift+F3, Shift+F5: предыдущее найденное, со строкой.\nF2: перезагружает файл, со звуком.\nF6: текстовый курсор включён или выключен. Стрелки читают текст только пока он включён, и Total Commander это запоминает.\nF11: развёрнутое окно включено или выключено.\nAlt+Enter: полноэкранный режим включён или выключен.\nПлюс, минус: крупнее или мельче шрифт, со звуком и новым размером.\nControl+0: сохранённый размер шрифта.\n%2: позиция в файле в процентах.\nЗвук и видео: ползунки молчат во время воспроизведения и говорят, когда вы их двигаете.\nTab: переходит между ползунками позиции и громкости.\nShift или Control со стрелками на ползунке: уходят в Lister, а не в JAWS.\n%1: список клавиш скриптов.
