msgTcListHelp=Список файлов\nСтрелки: имя элемента, а у отмеченных также "selected".\n"..": также папка, в которую ведёт.\nПробел: отмечает элемент или снимает отметку.\nF2, Control+R: перечитывают панель, со звуком.\nControl+F8: дерево каталогов; стрелки говорят папку, открыта она или закрыта, и её уровень.\nСтрелка вправо в дереве: открывает папку.\nСтрелка влево в дереве: закрывает папку.\n%1: вся строка.\n%2: список клавиш скриптов.
msgTcAppHelp=Скрипты JAWS для Total Commander, версия %1. Скрипты сокращают то, что читается в списке файлов и дереве каталогов, делают удобными диалоги Total Commander, Lister, сравнение по содержимому и синхронизацию каталогов, а также добавляют клавиши для столбцов, пути и строк состояния. Для списка клавиш нажмите %2.
