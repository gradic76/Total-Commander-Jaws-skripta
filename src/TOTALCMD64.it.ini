msgTcSyncHelp=Sincronizza cartelle\nFrecce nei risultati: il nome del file e la relazione: uguale, diverso, da sinistra a destra, da destra a sinistra, solo a sinistra, solo a destra, non ancora confrontato o salta.\n%1: la riga intera con dimensioni e date.\nSpazio: cambia la direzione di copia della riga o la disattiva (salta). JAWS legge così com'è l'annuncio di Total Commander sulla riga modificata.\nControl+Shift+L: mostra da sinistra a destra.\nControl+Shift+E: mostra uguali.\nControl+Shift+N: mostra diversi.\nControl+Shift+R: mostra da destra a sinistra.\nControl+Shift+D: mostra duplicati.\nControl+Shift+S: mostra singoli.\nDopo ciascuno di questi tasti: la riga di stato di Total Commander con il numero di elementi mostrati e nascosti.\nPulsante Sincronizza: una finestra con le direzioni di copia e le relative cartelle di destinazione.
msgTcCompareHelp=Confronta per contenuto\nApertura della finestra, Confronta: il file di sinistra, il file di destra e la riga di stato di Total Commander.\nModifica: premerlo prima; i riquadri ricevono allora un cursore di testo.\nDifferenza successiva, Differenza precedente: in modifica, la riga di entrambi i file, prima quella di sinistra; "blank" per un lato senza quella riga.\nFrecce: leggono le righe.\nFuori dalla modifica: solo la riga di stato, perché lì non si può sapere quale differenza sia quella attuale.\nRighe lunghe: si leggono fin dove il riquadro le mostra.\n%1: quale file è a sinistra e quale a destra, e la riga di stato.
