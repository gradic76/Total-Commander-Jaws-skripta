msgTcHotKeyHelp=Tasti degli script per Total Commander\n%1 a %2: le colonne dopo il nome dell'elemento con il focus, con il titolo di colonna dall'intestazione, nell'ordine in cui Total Commander le mostra. Seguono ogni visualizzazione e le vostre colonne personalizzate. Nell'elenco completo: 1 dimensione, 2 data e ora, 3 attributi. Premuto due volte rapidamente, mostra tutte le colonne dell'elemento nel visualizzatore virtuale, una per riga, con il cursore sulla colonna richiesta.\n%3: percorso del pannello attivo; premuto due volte rapidamente, lo copia negli appunti.\n%8: quale pannello è attivo.\n%4: la riga intera dell'elemento, con la posizione.\n%5: riga di stato del pannello attivo; nella finestra di avanzamento, un riepilogo dell'avanzamento; in Lister, la posizione nel file in percentuale.\n%9: riga di stato e spazio libero dell'altro pannello, ad es. per controllare la destinazione prima di copiare.\n%6: nelle finestre di dialogo di Total Commander legge l'intera finestra; nella finestra Confronta per contenuto, entrambi i file e la riga di stato.\n%7: versione degli script.
