msgTcListHelp=Elenco file\nFrecce: il nome dell'elemento e, per quelli marcati, anche "selected".\n"..": anche la cartella a cui porta.\nSpazio: marca l'elemento o toglie il marcatore.\nF2, Control+R: rileggono il pannello, con un suono.\nControl+F8: struttura delle cartelle; le frecce dicono la cartella, se è aperta o chiusa, e il suo livello.\nFreccia destra nella struttura: apre la cartella.\nFreccia sinistra nella struttura: chiude la cartella.\n%1: la riga intera.\n%2: l'elenco dei tasti degli script.
msgTcAppHelp=Script JAWS per Total Commander, versione %1. Gli script abbreviano ciò che viene letto nell'elenco dei file e nella struttura delle cartelle, rendono utilizzabili le finestre di dialogo di Total Commander, Lister, il confronto per contenuto e la sincronizzazione delle cartelle, e aggiungono tasti per colonne, percorso e righe di stato. Per l'elenco dei tasti premere %2.
