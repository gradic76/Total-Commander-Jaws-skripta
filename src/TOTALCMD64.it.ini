msgTcListerHelp=Lister\nApertura di Lister: il nome del file.\nN, Alt+Freccia destra: il file successivo, con il nome.\nP, Alt+Freccia sinistra: il file precedente, con il nome.\n1 a 8: la modalità di visualizzazione.\nF7, Control+F: ricerca; poi la riga intera con il risultato.\nF3, F5, Shift+F7: il risultato successivo, con la riga.\nShift+F3, Shift+F5: il risultato precedente, con la riga.\nF2: ricarica il file, con un suono.\nF6: cursore di testo attivato o disattivato. Le frecce leggono il testo solo mentre è attivo, e Total Commander lo ricorda.\nF11: finestra ingrandita attivata o disattivata.\nAlt+Invio: schermo intero attivato o disattivato.\nPiù, meno: carattere più grande o più piccolo, con un suono e la nuova dimensione.\nControl+0: la dimensione del carattere salvata.\n%2: posizione nel file in percentuale.\nAudio e video: i cursori tacciono durante la riproduzione e parlano quando li si sposta.\nTab: passa tra i cursori di posizione e di volume.\nShift o Control con le frecce su un cursore: vanno a Lister, non a JAWS.\n%1: l'elenco dei tasti degli script.
