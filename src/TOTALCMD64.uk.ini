msgTcSyncHelp=Синхронізація каталогів\nСтрілки в результатах: ім'я файлу і відношення: однакові, різні, зліва направо, справа наліво, тільки зліва, тільки справа, ще не порівняно або пропустити.\n%1: увесь рядок з розмірами і датами.\nПробіл: змінює напрям копіювання рядка або вимикає його (пропустити). Повідомлення Total Commander про змінений рядок JAWS читає таким, яке воно є.\nControl+Shift+L: показати зліва направо.\nControl+Shift+E: показати однакові.\nControl+Shift+N: показати різні.\nControl+Shift+R: показати справа наліво.\nControl+Shift+D: показати дублікати.\nControl+Shift+S: показати поодинокі.\nПісля кожної з цих клавіш: рядок стану Total Commander з кількістю показаних і прихованих.\nКнопка Синхронізувати: діалог з напрямками копіювання та їхніми цільовими папками.
msgTcCompareHelp=Порівняння за вмістом\nВідкриття вікна, Порівняти: лівий файл, правий файл і рядок стану Total Commander.\nРедагування: натисніть спочатку його; панелі тоді отримують текстовий курсор.\nНаступна відмінність, Попередня відмінність: під час редагування рядок з обох файлів, спочатку лівий; "blank" для сторони без цього рядка.\nСтрілки: читають рядки.\nПоза редагуванням: тільки рядок стану, бо там неможливо знати, яка відмінність поточна.\nДовгі рядки: читаються настільки, наскільки їх показує панель.\n%1: який файл лівий, а який правий, і рядок стану.
