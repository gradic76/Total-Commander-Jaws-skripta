msgTcHotKeyHelp=Клавіші скриптів для Total Commander\n%1 до %2: стовпці після імені елемента у фокусі, із заголовком стовпця з шапки, у тому порядку, в якому їх показує Total Commander. Працюють у будь-якому режимі та з вашими власними стовпцями. У повному режимі: 1 розмір, 2 дата і час, 3 атрибути. При подвійному швидкому натисканні показує всі стовпці елемента у віртуальному переглядачі, по одному в рядку, з курсором на потрібному стовпці.\n%3: шлях активної панелі; при подвійному швидкому натисканні копіює його в буфер обміну.\n%8: яка панель активна.\n%4: увесь рядок елемента, з позицією.\n%5: рядок стану активної панелі; у вікні прогресу підсумок прогресу; у Lister позиція у файлі у відсотках.\n%9: рядок стану і вільне місце іншої панелі, наприклад для перевірки цілі перед копіюванням.\n%6: у діалогах Total Commander читає весь діалог; у вікні порівняння за вмістом обидва файли і рядок стану.\n%7: версія скриптів.
