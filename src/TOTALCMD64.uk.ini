msgTcListerHelp=Lister\nВідкриття Lister: ім'я файлу.\nN, Alt+Стрілка вправо: наступний файл, з ім'ям.\nP, Alt+Стрілка вліво: попередній файл, з ім'ям.\n1 до 8: режим перегляду.\nF7, Control+F: пошук; потім увесь рядок зі знайденим.\nF3, F5, Shift+F7: наступне знайдене, з рядком.\nShift+F3, Shift+F5: попереднє знайдене, з рядком.\nF2: перезавантажує файл, зі звуком.\nF6: текстовий курсор увімкнено або вимкнено. Стрілки читають текст тільки поки він увімкнений, і Total Commander це запам'ятовує.\nF11: розгорнуте вікно увімкнено або вимкнено.\nAlt+Enter: повноекранний режим увімкнено або вимкнено.\nПлюс, мінус: більший або менший шрифт, зі звуком і новим розміром.\nControl+0: збережений розмір шрифту.\n%2: позиція у файлі у відсотках.\nЗвук і відео: повзунки мовчать під час відтворення і говорять, коли ви їх рухаєте.\nTab: переходить між повзунками позиції і гучності.\nShift або Control зі стрілками на повзунку: ідуть до Lister, а не до JAWS.\n%1: список клавіш скриптів.
