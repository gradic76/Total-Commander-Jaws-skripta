msgTcListHelp=Список файлів\nСтрілки: ім'я елемента, а для позначених також "selected".\n"..": також папка, до якої веде.\nПробіл: позначає елемент або знімає позначку.\nF2, Control+R: перечитують панель, зі звуком.\nControl+F8: дерево каталогів; стрілки кажуть папку, відкрита вона чи закрита, і її рівень.\nСтрілка вправо в дереві: відкриває папку.\nСтрілка вліво в дереві: закриває папку.\n%1: увесь рядок.\n%2: список клавіш скриптів.
msgTcAppHelp=Скрипти JAWS для Total Commander, версія %1. Скрипти скорочують те, що читається у списку файлів і дереві каталогів, роблять зручними діалоги Total Commander, Lister, порівняння за вмістом і синхронізацію каталогів, а також додають клавіші для стовпців, шляху і рядків стану. Для списку клавіш натисніть %2.
