msgTcSyncHelp=Synchroniser les dossiers\nFlèches dans les résultats : le nom du fichier et sa relation : identique, différent, de gauche à droite, de droite à gauche, seulement à gauche, seulement à droite, pas encore comparé ou ignorer.\n%1 : la ligne entière avec tailles et dates.\nEspace : change le sens de copie de la ligne ou la désactive (ignorer). JAWS lit telle quelle l'annonce de Total Commander sur la ligne modifiée.\nControl+Shift+L : afficher de gauche à droite.\nControl+Shift+E : afficher les identiques.\nControl+Shift+N : afficher les différents.\nControl+Shift+R : afficher de droite à gauche.\nControl+Shift+D : afficher les doublons.\nControl+Shift+S : afficher les uniques.\nAprès chacune de ces touches : la ligne d'état de Total Commander avec le nombre d'éléments affichés et masqués.\nBouton Synchroniser : un dialogue avec les sens de copie et leurs dossiers de destination.
msgTcCompareHelp=Comparer par contenu\nOuverture de la fenêtre, Comparer : le fichier de gauche, le fichier de droite et la ligne d'état de Total Commander.\nÉdition : appuyez d'abord dessus ; les volets reçoivent alors un curseur de texte.\nDifférence suivante, Différence précédente : en édition, la ligne des deux fichiers, celle de gauche d'abord ; "blank" pour un côté sans cette ligne.\nFlèches : lisent les lignes.\nHors édition : seulement la ligne d'état, car on ne peut pas y savoir quelle différence est en cours.\nLignes longues : lues autant que le volet les affiche.\n%1 : quel fichier est à gauche et lequel à droite, et la ligne d'état.
