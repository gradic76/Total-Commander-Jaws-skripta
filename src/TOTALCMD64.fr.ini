msgTcListHelp=Liste des fichiers\nFlèches : le nom de l'élément et, pour les éléments marqués, aussi "selected".\n".." : aussi le dossier auquel il mène.\nEspace : marque l'élément ou retire la marque.\nF2, Control+R : relisent le panneau, avec un son.\nControl+F8 : arborescence des dossiers ; les flèches disent le dossier, s'il est ouvert ou fermé, et son niveau.\nFlèche droite dans l'arborescence : ouvre le dossier.\nFlèche gauche dans l'arborescence : ferme le dossier.\n%1 : la ligne entière.\n%2 : la liste des touches des scripts.
msgTcAppHelp=Scripts JAWS pour Total Commander, version %1. Les scripts raccourcissent ce qui est lu dans la liste des fichiers et l'arborescence des dossiers, rendent utilisables les dialogues de Total Commander, Lister, la comparaison par contenu et la synchronisation des dossiers, et ajoutent des touches pour les colonnes, le chemin et les lignes d'état. Pour la liste des touches, appuyez sur %2.
