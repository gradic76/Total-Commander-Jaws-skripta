msgTcHotKeyHelp=Touches des scripts pour Total Commander\n%1 à %2 : les colonnes après le nom de l'élément ayant le focus, avec le titre de colonne de l'en-tête, dans l'ordre où Total Commander les affiche. Elles suivent chaque affichage et vos propres colonnes. En affichage Complet : 1 taille, 2 date et heure, 3 attributs. Appuyé deux fois rapidement, affiche toutes les colonnes de l'élément dans le visualiseur virtuel, une par ligne, avec le curseur sur la colonne demandée.\n%3 : chemin du panneau actif ; appuyé deux fois rapidement, il est copié dans le presse-papiers.\n%8 : quel panneau est actif.\n%4 : la ligne entière de l'élément, avec sa position.\n%5 : ligne d'état du panneau actif ; dans la fenêtre de progression, un résumé de la progression ; dans Lister, la position dans le fichier en pourcentage.\n%9 : ligne d'état et espace libre de l'autre panneau, par exemple pour vérifier la destination avant de copier.\n%6 : dans les dialogues de Total Commander, lit tout le dialogue ; dans la fenêtre Comparer par contenu, les deux fichiers et la ligne d'état.\n%7 : version des scripts.
