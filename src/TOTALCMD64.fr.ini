msgTcListerHelp=Lister\nOuverture de Lister : le nom du fichier.\nN, Alt+Flèche droite : le fichier suivant, avec son nom.\nP, Alt+Flèche gauche : le fichier précédent, avec son nom.\n1 à 8 : le mode d'affichage.\nF7, Control+F : recherche ; ensuite la ligne entière avec le résultat.\nF3, F5, Shift+F7 : le résultat suivant, avec sa ligne.\nShift+F3, Shift+F5 : le résultat précédent, avec sa ligne.\nF2 : recharge le fichier, avec un son.\nF6 : curseur de texte activé ou désactivé. Les flèches ne lisent le texte que lorsqu'il est activé, et Total Commander s'en souvient.\nF11 : fenêtre agrandie activée ou désactivée.\nAlt+Entrée : plein écran activé ou désactivé.\nPlus, moins : police plus grande ou plus petite, avec un son et la nouvelle taille.\nControl+0 : la taille de police enregistrée.\n%2 : position dans le fichier en pourcentage.\nAudio et vidéo : les curseurs se taisent pendant la lecture et parlent quand vous les déplacez.\nTab : passe entre les curseurs de position et de volume.\nShift ou Control avec les flèches sur un curseur : vont à Lister, pas à JAWS.\n%1 : la liste des touches des scripts.
