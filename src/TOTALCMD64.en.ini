msgTcListerHelp=Lister. The scripts say the file name when Lister opens and after N, P, Alt+Left Arrow or Alt+Right Arrow, the display mode after the keys 1 to 8, the whole line after a search (F7, F3, F5 and the other search keys), and whether the text cursor, the maximized window or full screen mode is on after F6, F11 or Alt+Enter. F2, which reloads the file, plays a sound. Plus and minus, on the main keyboard or the numeric keypad, change the font size with a sound and say the new size; Control+0 returns to the stored size. %2 says the position in the file in percent. The arrow keys read the text only while the text cursor is on; F6 turns it on and off, and Total Commander remembers it. When Lister plays audio or video, the position and volume sliders stay silent while playing and speak only when you move them; Tab moves between them, and Shift or Control with the arrow keys go to Lister, not to JAWS. %1 lists the script keys.
