msgTcSyncHelp=Synchronize directories. After Compare, the arrow keys read each result as the file name and its relation: equal, different, left to right, right to left, left only, right only, not compared yet, or skip; Insert+Up Arrow reads the whole row with sizes and dates. Space changes the copy direction of a row or switches it off (skip); Total Commander's own announcement of the changed row is read by JAWS as it is. The Show buttons are only painted; switch them with Control+Shift plus L (left to right), E (equal), N (different), R (right to left), D (duplicates) or S (singles), and the scripts say which one and Total Commander's status line with the shown and hidden counts. Synchronize opens a dialog with the copy directions and their target folders.
msgTcCompareHelp=Compare by content. When the window opens and after each comparison, the scripts say the left file, the right file and Total Commander's status line. To hear the differences, first press the Editing button: the panes then get a text cursor, and Next difference and Previous difference say the line from both files, left first, with "blank" for a side without that line. The arrow keys read the lines. Outside Editing mode only the status line is said, since the current difference cannot be known there. Long lines are read as far as the pane shows them. %1 says which file is left and which right, and the status line.
