msgTcListerHelp=Lister\nÅbning af Lister: filnavnet.\nN, Alt+Højre pil: næste fil, med navn.\nP, Alt+Venstre pil: forrige fil, med navn.\n1 til 8: visningstilstand.\nF7, Control+F: søgning; derefter hele linjen med fundet.\nF3, F5, Shift+F7: næste fund, med linjen.\nShift+F3, Shift+F5: forrige fund, med linjen.\nF2: genindlæser filen, med en lyd.\nF6: tekstmarkør til eller fra. Piletasterne læser kun teksten, mens den er slået til, og Total Commander husker det.\nF11: maksimeret vindue til eller fra.\nAlt+Enter: fuld skærm til eller fra.\nPlus, minus: større eller mindre skrift, med en lyd og den nye størrelse.\nControl+0: den gemte skriftstørrelse.\n%2: position i filen i procent.\nLyd og video: skyderne er tavse under afspilning og taler, når du flytter dem.\nTab: skifter mellem skyderne for position og lydstyrke.\nShift eller Control med piletasterne på en skyder: går til Lister, ikke til JAWS.\n%1: listen over scripttaster.
