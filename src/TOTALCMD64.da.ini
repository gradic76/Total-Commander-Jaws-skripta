msgTcSyncHelp=Synkroniser mapper\nPiletaster i resultaterne: filnavnet og forholdet: ens, forskellig, fra venstre til højre, fra højre til venstre, kun venstre, kun højre, endnu ikke sammenlignet eller spring over.\n%1: hele rækken med størrelser og datoer.\nMellemrum: skifter kopiretningen for rækken eller slår den fra (spring over). Total Commanders egen meddelelse om den ændrede række læser JAWS, som den er.\nControl+Shift+L: vis fra venstre til højre.\nControl+Shift+E: vis ens.\nControl+Shift+N: vis forskellige.\nControl+Shift+R: vis fra højre til venstre.\nControl+Shift+D: vis dubletter.\nControl+Shift+S: vis enkeltstående.\nEfter hver af disse taster: Total Commanders statuslinje med antal viste og skjulte.\nKnappen Synkroniser: en dialog med kopiretningerne og deres destinationsmapper.
msgTcCompareHelp=Sammenlign efter indhold\nÅbning af vinduet, Sammenlign: venstre fil, højre fil og Total Commanders statuslinje.\nRediger: tryk på den først; ruderne får så en tekstmarkør.\nNæste forskel, Forrige forskel: under redigering linjen fra begge filer, venstre først; "blank" for en side uden den linje.\nPiletaster: læser linjerne.\nUden for redigering: kun statuslinjen, da den aktuelle forskel ikke kan kendes der.\nLange linjer: læses så langt ruden viser dem.\n%1: hvilken fil der er venstre og hvilken højre, og statuslinjen.
