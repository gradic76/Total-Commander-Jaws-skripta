msgTcListHelp=Filliste\nPiletaster: elementets navn og for markerede elementer også "selected".\n"..": også mappen, den fører til.\nMellemrum: markerer elementet eller fjerner markeringen.\nF2, Control+R: genindlæser ruden, med en lyd.\nControl+F8: mappetræ; piletasterne siger mappen, om den er åben eller lukket, og dens niveau.\nHøjre pil i træet: åbner mappen.\nVenstre pil i træet: lukker mappen.\n%1: hele rækken.\n%2: listen over scripttaster.
msgTcAppHelp=JAWS-scripts til Total Commander, version %1. Scripterne forkorter det, der læses op i fillisten og mappetræet, gør Total Commanders dialoger, Lister, sammenligning efter indhold og synkronisering af mapper brugbare og tilføjer taster til kolonner, sti og statuslinjer. Tryk %2 for listen over taster.
