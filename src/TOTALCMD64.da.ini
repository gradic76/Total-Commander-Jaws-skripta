msgTcHotKeyHelp=Scripttaster til Total Commander\n%1 til %2: kolonnerne efter navnet på elementet i fokus, med kolonneoverskriften fra headeren, i den rækkefølge Total Commander viser dem. De følger enhver visning og dine egne kolonner. I lang visning: 1 størrelse, 2 dato og tid, 3 attributter. Trykket to gange hurtigt vises alle elementets kolonner i den virtuelle fremviser, én pr. linje, med markøren på den ønskede kolonne.\n%3: stien til den aktive rude; trykket to gange hurtigt kopieres den til udklipsholderen.\n%8: hvilken rude der er aktiv.\n%4: hele elementets række, med position.\n%5: statuslinjen for den aktive rude; i statusvinduet et resumé af forløbet; i Lister positionen i filen i procent.\n%9: statuslinje og ledig plads for den anden rude, f.eks. for at tjekke destinationen før kopiering.\n%6: i Total Commanders dialoger læses hele dialogen; i vinduet Sammenlign efter indhold begge filer og statuslinjen.\n%7: scripternes version.
