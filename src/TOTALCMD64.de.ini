msgTcListHelp=Dateiliste\nPfeiltasten: Name des Elements, bei markierten Elementen auch "selected".\n"..": auch der Ordner, zu dem es führt.\nLeertaste: markiert das Element oder hebt die Markierung auf.\nF2, Control+R: lesen das Fenster neu ein, mit einem Klang.\nControl+F8: Verzeichnisbaum; die Pfeiltasten sagen den Ordner, ob er geöffnet oder geschlossen ist, und seine Ebene.\nPfeil rechts im Baum: öffnet den Ordner.\nPfeil links im Baum: schließt den Ordner.\n%1: die ganze Zeile.\n%2: die Liste der Skripttasten.
msgTcAppHelp=JAWS-Skripte für Total Commander, Version %1. Die Skripte kürzen, was in der Dateiliste und im Verzeichnisbaum gesprochen wird, machen die Dialoge von Total Commander, Lister, den Vergleich nach Inhalt und das Synchronisieren von Verzeichnissen benutzbar und fügen Tasten für Spalten, Pfad und Statuszeilen hinzu. Für die Liste der Tasten drücken Sie %2.
msgTcProgressUnknown=Fortschritt nicht verfügbar
