msgTcHotKeyHelp=Skripttasten für Total Commander\n%1 bis %2: die Spalten nach dem Namen des Elements im Fokus, mit der Spaltenüberschrift aus dem Kopf, in der Reihenfolge, in der Total Commander sie anzeigt. Sie folgen jeder Ansicht und Ihren eigenen Spalten. In der Ansicht Lang: 1 Größe, 2 Datum und Zeit, 3 Attribute. Zweimal schnell gedrückt, zeigt alle Spalten des Elements im virtuellen Betrachter, eine pro Zeile, mit dem Cursor auf der gewünschten Spalte.\n%3: Pfad des aktiven Fensters; zweimal schnell gedrückt, wird er in die Zwischenablage kopiert.\n%8: welches Fenster aktiv ist.\n%4: die ganze Zeile des Elements, mit Position.\n%5: Statuszeile des aktiven Fensters; im Fortschrittsfenster eine Zusammenfassung des Fortschritts; in Lister die Position in der Datei in Prozent.\n%9: Statuszeile und freier Speicher des anderen Fensters, z. B. um das Ziel vor dem Kopieren zu prüfen.\n%6: in den Dialogen von Total Commander liest es den ganzen Dialog; im Fenster Nach Inhalt vergleichen beide Dateien und die Statuszeile.\n%7: Version der Skripte.
