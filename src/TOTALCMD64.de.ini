msgTcListerHelp=Lister\nÖffnen von Lister: der Dateiname.\nN, Alt+Pfeil rechts: nächste Datei, mit Namen.\nP, Alt+Pfeil links: vorherige Datei, mit Namen.\n1 bis 8: Anzeigemodus.\nF7, Control+F: Suche; danach die ganze Zeile mit dem Fund.\nF3, F5, Shift+F7: nächster Fund, mit Zeile.\nShift+F3, Shift+F5: vorheriger Fund, mit Zeile.\nF2: lädt die Datei neu, mit einem Klang.\nF6: Textcursor ein oder aus. Die Pfeiltasten lesen den Text nur, solange er eingeschaltet ist, und Total Commander merkt sich das.\nF11: maximiertes Fenster ein oder aus.\nAlt+Enter: Vollbild ein oder aus.\nPlus, Minus: größere oder kleinere Schrift, mit einem Klang und der neuen Größe.\nControl+0: die gespeicherte Schriftgröße.\n%2: Position in der Datei in Prozent.\nAudio und Video: die Schieberegler schweigen während der Wiedergabe und sprechen, wenn Sie sie bewegen.\nTab: wechselt zwischen den Schiebereglern für Position und Lautstärke.\nShift oder Control mit den Pfeiltasten auf einem Schieberegler: gehen an Lister, nicht an JAWS.\n%1: die Liste der Skripttasten.
