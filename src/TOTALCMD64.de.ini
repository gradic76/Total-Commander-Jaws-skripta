msgTcSyncHelp=Verzeichnisse synchronisieren\nPfeiltasten in den Ergebnissen: Dateiname und Beziehung: gleich, verschieden, von links nach rechts, von rechts nach links, nur links, nur rechts, noch nicht verglichen oder überspringen.\n%1: die ganze Zeile mit Größen und Daten.\nLeertaste: ändert die Kopierrichtung der Zeile oder schaltet sie aus (überspringen). Die Ansage von Total Commander zur geänderten Zeile liest JAWS so, wie sie ist.\nControl+Shift+L: von links nach rechts anzeigen.\nControl+Shift+E: gleiche anzeigen.\nControl+Shift+N: verschiedene anzeigen.\nControl+Shift+R: von rechts nach links anzeigen.\nControl+Shift+D: Duplikate anzeigen.\nControl+Shift+S: Einzelne anzeigen.\nNach jeder dieser Tasten: die Statuszeile von Total Commander mit der Anzahl angezeigter und ausgeblendeter.\nSchaltfläche Synchronisieren: ein Dialog mit den Kopierrichtungen und ihren Zielordnern.
msgTcCompareHelp=Nach Inhalt vergleichen\nÖffnen des Fensters, Vergleichen: linke Datei, rechte Datei und die Statuszeile von Total Commander.\nBearbeiten: zuerst drücken; die Bereiche erhalten dann einen Textcursor.\nNächster Unterschied, Vorheriger Unterschied: beim Bearbeiten die Zeile aus beiden Dateien, zuerst die linke; "blank" für eine Seite ohne diese Zeile.\nPfeiltasten: lesen die Zeilen.\nAußerhalb des Bearbeitens: nur die Statuszeile, da dort nicht bekannt ist, welcher Unterschied aktuell ist.\nLange Zeilen: werden so weit gelesen, wie der Bereich sie anzeigt.\n%1: welche Datei links und welche rechts ist, und die Statuszeile.
