msgTcHotKeyHelp=A Total Commander szkriptek billentyűi\n%1-től %2-ig: a fókuszban lévő elem neve utáni oszlopok, a fejléc oszlopcímével, abban a sorrendben, ahogy a Total Commander mutatja őket. Követnek minden nézetet és a saját oszlopait is. Teljes nézetben: 1 méret, 2 dátum és idő, 3 attribútumok. Kétszer gyorsan lenyomva az elem összes oszlopát mutatja a virtuális megjelenítőben, soronként egyet, a kurzorral a kért oszlopon.\n%3: az aktív panel útvonala; kétszer gyorsan lenyomva a vágólapra másolja.\n%8: melyik panel aktív.\n%4: az elem egész sora, a pozícióval.\n%5: az aktív panel állapotsora; a folyamatablakban a folyamat összefoglalója; a Listerben a pozíció a fájlban százalékban.\n%9: a másik panel állapotsora és szabad helye, pl. a cél ellenőrzésére másolás előtt.\n%6: a Total Commander párbeszédablakaiban az egész ablakot felolvassa; a tartalom szerinti összehasonlítás ablakában mindkét fájlt és az állapotsort.\n%7: a szkriptek verziója.
