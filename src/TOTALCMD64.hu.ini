msgTcListHelp=Fájllista\nNyilak: az elem neve, a kijelölt elemeknél "selected" is.\n"..": a mappa is, ahová vezet.\nSzóköz: kijelöli az elemet vagy megszünteti a kijelölést.\nF2, Control+R: újraolvassák a panelt, hanggal.\nControl+F8: mappafa; a nyilak megmondják a mappát, nyitva van-e vagy zárva, és a szintjét.\nJobbra nyíl a fában: megnyitja a mappát.\nBalra nyíl a fában: bezárja a mappát.\n%1: az egész sor.\n%2: a szkriptek billentyűinek listája.
msgTcAppHelp=JAWS szkriptek a Total Commanderhez, %1 verzió. A szkriptek lerövidítik, amit a fájllistában és a mappafában felolvas, használhatóvá teszik a Total Commander párbeszédablakait, a Listert, a tartalom szerinti összehasonlítást és a mappák szinkronizálását, és billentyűket adnak az oszlopokhoz, az útvonalhoz és az állapotsorokhoz. A billentyűk listájához nyomja meg: %2.
