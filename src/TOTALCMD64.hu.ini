msgTcListerHelp=Lister\nA Lister megnyitásakor: a fájl neve.\nN, Alt+Jobbra nyíl: a következő fájl, névvel.\nP, Alt+Balra nyíl: az előző fájl, névvel.\n1-től 8-ig: megjelenítési mód.\nF7, Control+F: keresés; utána a találatot tartalmazó egész sor.\nF3, F5, Shift+F7: a következő találat, a sorával.\nShift+F3, Shift+F5: az előző találat, a sorával.\nF2: újratölti a fájlt, hanggal.\nF6: szövegkurzor be vagy ki. A nyilak csak akkor olvassák a szöveget, amikor be van kapcsolva, és a Total Commander ezt megjegyzi.\nF11: teljes méretű ablak be vagy ki.\nAlt+Enter: teljes képernyő be vagy ki.\nPlusz, mínusz: nagyobb vagy kisebb betű, hanggal és az új mérettel.\nControl+0: a mentett betűméret.\n%2: pozíció a fájlban százalékban.\nHang és videó: a csúszkák lejátszás közben hallgatnak, és megszólalnak, amikor elmozdítja őket.\nTab: vált a pozíció és a hangerő csúszkája között.\nShift vagy Control a nyilakkal egy csúszkán: a Listerhez kerül, nem a JAWS-hoz.\n%1: a szkriptek billentyűinek listája.
