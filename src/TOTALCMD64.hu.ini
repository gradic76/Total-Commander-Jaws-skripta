msgTcSyncHelp=Mappák szinkronizálása\nNyilak a találatokban: a fájl neve és a viszony: egyforma, eltérő, balról jobbra, jobbról balra, csak bal, csak jobb, még nincs összehasonlítva vagy kihagyás.\n%1: az egész sor méretekkel és dátumokkal.\nSzóköz: megváltoztatja a sor másolási irányát vagy kikapcsolja (kihagyás). A Total Commander bejelentését a megváltozott sorról a JAWS úgy olvassa fel, ahogy van.\nControl+Shift+L: balról jobbra mutatása.\nControl+Shift+E: egyformák mutatása.\nControl+Shift+N: eltérők mutatása.\nControl+Shift+R: jobbról balra mutatása.\nControl+Shift+D: ismétlődők mutatása.\nControl+Shift+S: egyediek mutatása.\nMinden ilyen billentyű után: a Total Commander állapotsora a látható és rejtett elemek számával.\nSzinkronizálás gomb: párbeszédablak a másolási irányokkal és a célmappáikkal.
msgTcCompareHelp=Összehasonlítás tartalom alapján\nAz ablak megnyitásakor, Összehasonlítás: a bal fájl, a jobb fájl és a Total Commander állapotsora.\nSzerkesztés: először ezt nyomja meg; a panelek ekkor szövegkurzort kapnak.\nKövetkező eltérés, Előző eltérés: szerkesztéskor a sor mindkét fájlból, előbb a bal; "blank" annál az oldalnál, ahol nincs ilyen sor.\nNyilak: felolvassák a sorokat.\nSzerkesztésen kívül: csak az állapotsor, mert ott nem tudható, melyik az aktuális eltérés.\nHosszú sorok: annyit olvas fel, amennyit a panel mutat.\n%1: melyik fájl a bal és melyik a jobb, és az állapotsor.
